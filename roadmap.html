<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

</head><body>
  
  <title>Lộ trình học theo ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: một cột đọc rộng 820px, thanh tab buổi học dính trên cùng; hình minh họa luôn nằm trên nền sáng cố định để đọc được ở cả hai giao diện. */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --ink:#14213D; --muted:#56627F; --line:#D8DFEE;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF;
  --lvl:#C75A1B; --tile:#EAF1FF;
  --good:#17703F; --good-bg:#E1F3E8; --bad:#A8231B; --bad-bg:#FBE4E1; --note:#8A4F00; --note-bg:#FCEFD3;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#172036; --ink:#E7ECF8; --muted:#9AA6C3; --line:#2A3654;
    --accent:#7EA0FF; --accent-ink:#0E1526; --accent-soft:#22305A; --lvl:#F08A4B;
    --good:#6FDBA3; --good-bg:#16372A; --bad:#FF9B93; --bad-bg:#401B19; --note:#F2BC68; --note-bg:#3B2D12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#172036; --ink:#E7ECF8; --muted:#9AA6C3; --line:#2A3654;
  --accent:#7EA0FF; --accent-ink:#0E1526; --accent-soft:#22305A; --lvl:#F08A4B;
  --good:#6FDBA3; --good-bg:#16372A; --bad:#FF9B93; --bad-bg:#401B19; --note:#F2BC68; --note-bg:#3B2D12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:grid;gap:2px;min-width:0}
.brand b{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.brand span{font-size:.9rem;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:700}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.weeks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-block:4px 6px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;margin-top:6px}
.hero .kicker{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lvl)}
.hero ul{margin:0;padding-left:20px;display:grid;gap:4px}

.secbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:10px 10px}
.secs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.sec{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sec[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sec.tch{border-style:dashed}

.sechead{display:grid;gap:2px;padding-block:6px 4px}
.sechead .mins{color:var(--muted);font-size:.95rem}
.stack{display:grid;gap:16px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}

.textblk{padding:2px 4px}
.textblk ul{margin:6px 0 0;padding-left:22px;display:grid;gap:3px}

.tile{background:var(--tile);border-radius:14px;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;min-height:92px}
.tile .ico{width:92px;height:92px;flex:none}
.tile.sm .ico{width:74px;height:74px}
.scenebox{background:var(--tile);border-radius:14px;padding:8px;display:flex;justify-content:center}
.scene{width:100%;max-width:520px;height:auto;display:block}
.scenebox.sm .scene{max-width:170px}

.play{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.note{padding:12px 14px;border-radius:10px;background:var(--note-bg);color:var(--note);font-size:.97rem}
.tip{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.97rem}

.q.bad{border-color:var(--bad);background:var(--bad-bg)}
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qn{flex:none;min-width:2rem;height:2rem;border-radius:8px;background:var(--lvl);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;padding:0 6px}
:root[data-theme="dark"] .qn{color:#0E1526}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qn{color:#0E1526}}
.qt{font-weight:700;overflow-wrap:anywhere;min-width:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts.pic{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{position:relative;display:block;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ot{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;overflow-wrap:anywhere}
.opt .ot::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opts.pic .ot{flex-direction:column;justify-content:center;text-align:center}
.opts.pic .ot::before{order:2}
.opt input:checked + .ot{border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked + .ot::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 45%,transparent 50%)}
.opt input:focus-visible + .ot{outline:3px solid var(--accent);outline-offset:2px}
.optpic{display:block;width:100%}
.optpic .ico{width:64px;height:64px;display:block;margin:0 auto}
.optpic .scene{width:92px;max-width:100%;margin:0 auto}
.opt .optpic{background:var(--tile);border-radius:10px;padding:6px}
.gapq .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:1.1rem;font-weight:700}
.gap{font:inherit;font-weight:700;width:6.5rem;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.gap:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.q.ok .gap{border-color:var(--good)} .q.bad .gap{border-color:var(--bad)}
.bank{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:3px 12px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-weight:700}
.fb{font-size:.95rem;min-height:0}
.fb:empty{display:none}
.q.ok .fb{color:var(--good);font-weight:700}
.q.bad .fb{color:var(--bad)}
.tkey{font-size:.88rem;color:var(--note);background:var(--note-bg);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.92rem}
.score{font-weight:700}
.score.full{color:var(--good)}

.frames{margin:0;padding-left:22px;display:grid;gap:4px}
.prompt{font-family:var(--font-display);font-weight:600;font-size:1.25rem}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.shadow{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.shadow li{display:flex;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:1.1rem}
.shadow li b{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px}
.teacher{border:2px dashed var(--note);background:var(--note-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.96rem}
.teacher>b:first-child{color:var(--note)}
.script{display:grid;gap:8px}
.script .it{display:grid;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.92rem;min-width:0}
.script code{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.foot{padding:20px 4px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.blk{animation:rise .25s ease both}@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}


.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:6px;font-weight:700}
.login{max-width:480px;margin:40px auto 0}
.login input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.login input[type=text]:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pbar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.day{display:grid;gap:3px;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.day:hover:not(:disabled){border-color:var(--accent)}
.day .dn{font-family:var(--font-display);font-weight:600;color:var(--lvl)}
.day .dt{font-weight:700;overflow-wrap:anywhere}
.day .dm{font-size:.88rem;color:var(--muted)}
.day .ds{font-size:.85rem;font-weight:700;min-height:1.2em}
.day.done{border-color:var(--good);background:var(--good-bg)}
.day.done .ds{color:var(--good)}
.day.now{border-color:var(--accent);background:var(--accent-soft)}
.day.now .ds{color:var(--accent)}
.day:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted);font-size:.8rem;font-weight:700}
.wk.lk{opacity:.85}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnk{text-decoration:none;display:inline-block}
.emo{display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tile .emo{width:auto;height:auto;font-size:58px;line-height:1.1}
.tile.sm .emo{font-size:46px}
.optpic .emo{font-size:40px;line-height:1.1;width:auto;height:auto}
.gap{width:11rem;max-width:100%}
.recbox{display:grid;gap:10px}
.recbox audio,.subaud audio{width:100%}
.recnow{display:flex;gap:10px;align-items:center;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.btn.rec{background:var(--bad);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
textarea.wr{font:inherit;width:100%;min-height:170px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;line-height:1.6}
textarea.wr:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.kwl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:.95rem}
.kwl .y{color:var(--good);font-weight:700}.kwl .n{color:var(--muted)}
.kok{color:var(--good);font-weight:700}.kno{color:var(--muted)}
.heard{font-size:.95rem;padding:8px 12px;border-radius:10px;background:var(--bg);overflow-wrap:anywhere}
.tips{padding:10px 12px;border-radius:10px;background:var(--note-bg);color:var(--note);font-size:.95rem}
.sent{padding:8px 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:700}
.cmt{padding:8px 12px;border-radius:10px;background:var(--accent-soft);overflow-wrap:anywhere}
.shrow{display:grid;gap:6px}
.shline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shline>span{flex:1 1 200px;min-width:0}
.shbtn{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:700}
.shbtn.on{background:var(--accent);color:var(--accent-ink)}
.shp{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:#fff}
.shp.g{background:var(--good)}.shp.m{background:#B7791F}.shp.l{background:var(--bad)}
:root[data-theme="dark"] .shp{color:#0E1526}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shp{color:#0E1526}}
.subhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.subtxt{margin:0;white-space:pre-wrap;font:inherit;padding:10px 12px;background:var(--bg);border-radius:10px;overflow-wrap:anywhere}

.bookslot{display:grid;gap:8px;justify-items:center}
.bookslot img.bkpage{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.bookslot.empty.nots{display:none}
.bookslot.empty img{display:none}
.bookslot .slot{display:none;padding:12px 14px;border:2px dashed var(--note);border-radius:10px;background:var(--note-bg);color:var(--note);font-size:.92rem;overflow-wrap:anywhere;width:100%}
.bookslot.empty .slot{display:block}
img.bkimg{width:92px;height:92px;object-fit:contain;border-radius:10px}
.tile.sm img.bkimg{width:74px;height:74px}
.story .ctx{padding:10px 14px;border-left:5px solid var(--lvl);background:var(--bg);border-radius:0 10px 10px 0}
.story .ln{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.story .ln .who{font-weight:700;color:var(--lvl);font-size:.85rem}
.story .ln .en{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.story .ln .vi{font-size:.92rem;color:var(--muted)}
.story.hidevi .vi{display:none}
.story .use{padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:.97rem}
</style>

<script>
/* Dùng chung cho trang và cho công cụ tạo âm thanh. Không đụng tới DOM ở đây. */
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}
/* Một câu đọc: A("It is a cat.") hoặc A("It is a cat.","m",1) = giọng nam, đọc chậm */
function A(t,v,s){return {segs:[{v:v||'f',t:t}],s:s?1:0};}
/* Hội thoại nhiều giọng: D([["m","Hello"],["f","Hi"]]) */
function D(lines,s){return {segs:lines.map(function(l){return {v:l[0],t:l[1]};}),s:s?1:0};}
function aid(au){
  var key=JSON.stringify(au);
  var slug=au.segs[0].t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,26);
  return slug+'-'+hash(key);
}
function auText(au){return au.segs.map(function(s){return s.t;}).join(' ');}

/* Hình minh họa vẽ bằng SVG. Mỗi hàm trả về phần ruột của khung 100x100. */
var K={red:'#E0523C',blue:'#2F6FDE',yellow:'#F2C14E',green:'#4CA76B',orange:'#F0A04B',brown:'#A9744A',pink:'#F2A0B8',skin:'#F5CBA7',ink:'#1B2A4A',gray:'#7B8499',sky:'#9ED0F5',white:'#FFFFFF',purple:'#7A5BD6'};
function KC(c){return K[c]||c||K.red;}
var ICON={
ball:function(c){c=KC(c);return '<circle cx="50" cy="52" r="32" fill="'+c+'"/><path d="M20 44 Q50 62 80 44" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 66 Q50 50 78 66" fill="none" stroke="#fff" stroke-width="5"/><circle cx="50" cy="52" r="32" fill="none"/>';},

   note:'<b>Quy tắc:</b> thêm <b>-s</b> (gets, plays). Động từ tận cùng <b>-ch, -sh, -ss, -x, -o</b> thì thêm <b>-es</b> (watch → watches, brush → brushes, go → goes). Riêng <b>have → has</b>.<br><b>Câu hỏi và câu phủ định:</b> dùng do hoặc does, động từ trở về nguyên mẫu: <b>Does she get up early?</b> · <b>She doesn\'t get up early.</b> (không nói <i>She doesn\'t gets up</i>).'},
  {t:'rule',title:'Từ chỉ mức độ thường xuyên',
   head:['Từ','Nghĩa','Ví dụ'],
   rows:[['always','luôn luôn (100%)','I always brush my teeth before bed.',A('I always brush my teeth before bed.')],['usually','thường thường','She usually has noodles for breakfast.',A('She usually has noodles for breakfast.')],['often','hay, thường','We often play badminton at the weekend.',A('We often play badminton at the weekend.')],['sometimes','thỉnh thoảng','He sometimes reads a comic after dinner.',A('He sometimes reads a comic after dinner.')],['never','không bao giờ (0%)','I never watch TV before my homework.',A('I never watch TV before my homework.')]],
   note:'<b>Vị trí:</b> đứng <b>trước động từ thường</b> (I <b>always</b> get up early) nhưng <b>sau am, is, are</b> (She is <b>never</b> late).'},
  {t:'gap',title:'Điền dạng đúng của động từ',instr:'Gõ động từ trong ngoặc ở dạng đúng (nhớ -s hoặc -es với he, she, it), rồi bấm Kiểm tra.',qs:[
    G('She ',['gets up'],' at seven o\'clock. (get up)'),G('I ',['brush'],' my teeth every morning. (brush)'),G('My brother ',['watches'],' TV in the evening. (watch)'),G('Linh ',['has'],' lunch at school. (have)'),
    G('We ',['go'],' to school by bike. (go)'),G('He ',['does'],' his homework after dinner. (do)'),G('My mum ',['goes'],' to work by bus. (go)'),G('They ',['play'],' badminton on Sundays. (play)')]},
  {t:'mcq',title:'Chọn câu đúng',instr:'Chọn một đáp án cho mỗi câu.',qs:[
    Q('Which sentence is correct?',['He get up at six.','He gets up at six.','He getting up at six.'],1,'He là một người nên động từ thêm -s.'),
    Q('Which sentence is correct?',['I always am late.','I am always late.','I am late always.'],1,'Always đứng sau am, is, are.'),
    Q('My sister ___ her teeth twice a day.',['brush','brushes','brushing'],1,'Brush tận cùng -sh nên thêm -es.'),
    Q('Which sentence is correct?',['She doesn\'t likes fish.','She doesn\'t like fish.','She don\'t like fish.'],1,'Sau doesn\'t, động từ trở về nguyên mẫu.'),
    Q('___ your brother play football at the weekend?',['Do','Does','Is'],1,'Your brother là he nên dùng Does.'),
    Q('I ___ watch TV before I do my homework. (0%)',['always','sometimes','never'],2,'Never nghĩa là không bao giờ.')]},
  {t:'speak',title:'Nhìn tranh và nói',scene:'classroom',prompt:'Look at the picture. What are the children doing?',
   frames:['This is a ___. There are ___ children.','The girl with pigtails is ___ing a ___.','He / She is wearing ___.','The ___ is on / under / next to the ___.'],
   modelTitle:'Bài nói mẫu của cô',model:A('This is a classroom. There are five children. The girl with pigtails is reading a book. The boy next to her is writing. Jack is drawing and he is wearing glasses. Lucy is standing in front of the board. The clock is on the wall and the red bag is under the table.'),
   check:['Nói ít nhất 4 câu','Có There are và đếm đúng số bạn','Dùng đúng is/are + động từ-ing','Có từ chỉ vị trí (on, under, next to, in front of)'],
   kw:[{l:'There are / There is',re:'there (is|are)'},{l:'Động từ -ing',re:'\\w+ing\\b'},{l:'Vị trí (on, under, next to...)',re:'\\b(on|under|next to|in front of|behind)\\b'},{l:'Màu sắc',re:'\\b(red|blue|green|brown|yellow|black|pink)\\b'}],minWords:25},
  {t:'teacher',html:'<b>Phân bổ 25 phút:</b> 0–3 chào hỏi, hỏi miệng "What time do you get up?" · 3–9 từ mới (đọc, đóng kịch động tác) · 9–15 thêm -s/-es, bảng tần suất · 15–20 điền động từ, chọn câu đúng · 20–25 nhìn tranh và nói (học sinh ghi âm và nộp ngay trên trang).<br><b>Lỗi hay gặp của học sinh lớp 4:</b> quên -s với he/she/it, thêm -s sau does/doesn\'t, đặt always sau động từ thường, nuốt âm cuối.<br><b>Cách sửa:</b> không ngắt lời. Nhắc lại câu đúng chậm rồi cho bé nói lại. Mục tiêu cuối buổi: 4 câu liên tiếp đúng cấu trúc.'}
 ]},

 {id:'b2',tab:'Buổi 2',title:'Nghe, Đọc và Âm cuối -s',mins:25,blocks:[

    Q('What time does Tom get up?',['6:30','7:00','7:30'],1,'',{au:A('Tom gets up at seven o\'clock every day.')}),
    Q('What does Mia usually have for breakfast?',['Noodles','Bread and eggs','Rice'],0,'',{au:A('Mia usually has noodles for breakfast.')}),
    Q('How does Ben go to school?',['By bus','By bike','On foot'],1,'',{au:A('Ben goes to school by bike because his school is near his house.')}),

   head:['Nguyên mẫu','Thêm -s / -es'],pairs:[['get','gets'],['play','plays'],['read','reads'],['watch','watches'],['brush','brushes'],['go','goes']],
   tip:'<b>Ba cách đọc:</b> sau âm vô thanh (p, t, k) đọc <b>/s/</b>: gets. Sau âm hữu thanh và nguyên âm đọc <b>/z/</b>: plays, reads, goes. Sau -ch, -sh, -s, -x đọc <b>/ɪz/</b> và thành hai âm tiết: watch – wa-tchiz, brush – bru-shiz.'},
  {t:'mcq',title:'Nghe: có -s hay không?',instr:'Nghe một từ rồi chọn từ em nghe thấy.',qs:[

    Q('Em nghe thấy từ nào?',['play','plays'],0,'Từ là play.',{au:A('play')}),
    Q('Em nghe thấy từ nào?',['watch','watches'],1,'Từ là watches (hai âm tiết).',{au:A('watches')}),
    Q('Em nghe thấy từ nào?',['brush','brushes'],0,'Từ là brush.',{au:A('brush')}),

  {t:'mcq',title:'Đọc hiểu: Linh\'s day',instr:'Nghe hoặc đọc đoạn văn, rồi trả lời.',
   passage:'My name is Linh and I am ten years old. I live in Da Nang with my parents and my little brother. On school days I get up at half past six. I usually have noodles for breakfast, but on Sundays I sometimes have bread and eggs. I go to school by bike and my lessons start at a quarter to eight. After school I always do my homework and then I play badminton with my brother. I never watch TV before dinner. My dad cooks dinner and we eat together at seven. I go to bed at nine o\'clock.',
   passageAu:A('My name is Linh and I am ten years old. I live in Da Nang with my parents and my little brother. On school days I get up at half past six. I usually have noodles for breakfast, but on Sundays I sometimes have bread and eggs. I go to school by bike and my lessons start at a quarter to eight. After school I always do my homework and then I play badminton with my brother. I never watch TV before dinner. My dad cooks dinner and we eat together at seven. I go to bed at nine o\'clock.'),
   qs:[Q('What time does Linh get up on school days?',['6:30','7:00','7:45'],0,'Half past six là 6:30.'),
       Q('What does Linh sometimes have for breakfast on Sundays?',['Noodles','Bread and eggs','Rice and fish'],1,'On Sundays I sometimes have bread and eggs.'),
       Q('How does Linh go to school?',['By bus','On foot','By bike'],2,'I go to school by bike.'),
       Q('Linh watches TV before dinner.',TF,1,'Linh never watches TV before dinner.'),
       Q('Who cooks dinner?',['Linh','Her dad','Her brother'],1,'My dad cooks dinner.')]},
  {t:'teacher',html:'<b>Phân bổ 25 phút:</b> 0–5 ôn -s/-es và tần suất · 5–12 nghe chọn đáp án và nghe hội thoại · 12–18 âm cuối -s (đặt tay trước miệng cảm nhận hơi ra, vỗ tay số âm tiết) · 18–25 đọc hiểu.<br><b>Kiểm tra nhanh cuối buổi:</b> hỏi miệng 3 câu: "What time do you get up?" "What do you usually have for breakfast?" "Does your dad cook dinner?" Bé trả lời bằng câu đầy đủ.<br><b>Nếu bé sai nhiều ở nghe hội thoại:</b> bé chưa bắt được giờ giấc và từ tần suất khi nghe nhanh. Cho nghe lại và yêu cầu bé gạch chân giờ và từ always/usually/never.'}
 ]},

function collectAudio(node,out){

}

/* ---------- lộ trình theo ngày ---------- */
var DAYMAP6=[{s:'b1',k:'Bài học'},{s:'h1',k:'Bài tập'},{s:'h2',k:'Bài tập'},{s:'b2',k:'Bài học'},{s:'h3',k:'Bài tập'},{s:'h4',k:'Bài tập'}];
var CLASS_ROWS=null,CLASS_ERR='';
function daysOfId(wid){var w=weekById(wid);return (w&&w.days)||DAYMAP6;}
function dayOffset(wid){var n=0;WEEKS.forEach(function(w){if(w.id<wid){n+=((w.days)||DAYMAP6).length;}});return n;}
function weekById(id){return WEEKS.filter(function(w){return w.id===id;})[0];}
function weekObj(){return weekById(ST.week);}
function secById(w,s){return w.sections.filter(function(x){return x.id===s;})[0];}
function secObj(w){return secById(w,ST.sec);}
function doneMap(){if(!P._done){P._done={};}return P._done;}
function isDone(wid,s){return !!doneMap()['w'+wid+'.'+s];}
function unlockWeek(){return (ST.user&&ST.user.unlockWeek)||1;}
function isLocked(wid){return !ST.teacher&&wid>unlockWeek();}
function dayNo(wid,idx){return dayOffset(wid)+idx+1;}
function dayIdx(s){var m=daysOfId(ST.week);for(var i=0;i<m.length;i++){if(m[i].s===s){return i;}}return -1;}
function flatDays(){var a=[];WEEKS.forEach(function(w){daysOfId(w.id).forEach(function(m,j){a.push({w:w.id,s:m.s,idx:j});});});return a;}
function nextTodo(){
  var a=flatDays();
  for(var i=0;i<a.length;i++){if(!isLocked(a[i].w)&&!isDone(a[i].w,a[i].s)){return a[i];}}
  return null;
}
function counts(){var t=0,d=0;flatDays().forEach(function(x){if(isLocked(x.w)){return;}t++;if(isDone(x.w,x.s)){d++;}});return {t:t,d:d};}

function renderDay(){
  var w=weekObj();
  if(!w){ST.view='map';render();return;}
  var h='<div class="wrap">'+topbar();
  if(ST.sec==='script'){
    if(!ST.teacher){ST.view='map';render();return;}
    h+='<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>'+esc(w.title)+' · Kịch bản thu âm</b></div></div><main class="stack">'+rScript(w)+'</main></div>';
    stopAll();$('app').innerHTML=h;return;
  }
  var sec=secObj(w),idx=dayIdx(ST.sec);
  if(!sec){ST.view='map';render();return;}
  h+='<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>Ngày '+dayNo(w.id,idx)+' · '+esc(w.title)+'</b></div></div>';
  h+='<main class="stack"><div class="sechead"><h2>'+esc(sec.title)+'</h2><span class="mins">'+daysOfId(w.id)[idx].k+' · khoảng '+sec.mins+' phút</span></div>';
  sec.blocks.forEach(function(b,i){var id=bid(i);
    switch(b.t){
      case 'text':h+=rText(b);break;case 'teacher':h+=rTeacher(b);break;case 'scene':h+=rScene(b);break;
      case 'vocab':h+=rVocab(b);break;case 'rule':h+=rRule(b);break;case 'pics':h+=rPics(b);break;
      case 'mcq':h+=rMcq(b,id);break;case 'gap':h+=rGap(b,id);break;case 'sounds':h+=rSounds(b);break;
      case 'speak':h+=rSpeak(b,id);break;case 'shadow':h+=rShadow(b,id);break;case 'write':h+=rWrite(b,id);break;case 'model':h+=rModel(b);break;case 'check':h+=rCheck(b,id);break;case 'bookimg':h+=rBookimg(b);break;case 'story':h+=rStoryBlk(b);break;
    }
  });
  var dn=isDone(w.id,ST.sec);
  h+='<section class="blk"><div class="actions"><button type="button" class="btn" data-act="done" id="doneBtn">'+(dn?'Bỏ đánh dấu đã xong':'Hoàn thành ngày học')+'</button><span class="score full" id="doneMsg" aria-live="polite">'+(dn?'Em đã hoàn thành ngày này.':'')+'</span></div></section>';
  var fl=flatDays(),pos=-1;
  fl.forEach(function(x,i){if(x.w===w.id&&x.s===ST.sec){pos=i;}});
  var pv=pos>0?fl[pos-1]:null,nx=pos<fl.length-1?fl[pos+1]:null;
  if(nx&&isLocked(nx.w)){nx=null;}
  h+='<div class="nav">'+(pv?'<button type="button" class="btn ghost sm" data-open="w'+pv.w+'-'+pv.s+'">← Ngày '+dayNo(pv.w,pv.idx)+'</button>':'<span></span>')+(nx?'<button type="button" class="btn ghost sm" data-open="w'+nx.w+'-'+nx.s+'">Ngày '+dayNo(nx.w,nx.idx)+' →</button>':'<span></span>')+'</div>';
  h+='</main></div>';
  stopAll();
  $('app').innerHTML=h;
  document.querySelectorAll('[data-t="mcq"],[data-t="gap"]').forEach(function(el){if((P[el.getAttribute('data-b')]||{}).c){grade(el,false);}});
  refreshActs();
}

function render(){
  recAbort();
  if(!ST.user){renderLogin();return;}
  if(ST.view==='day'){renderDay();}
  else if(ST.view==='class'){renderClass();}
  else if(ST.view==='subs'){renderSubs();}
  else{renderMap();}
}

/* ---------- đăng nhập ---------- */
function applyStudent(s,code){
  ST.user={name:s.name,code:code,role:s.role||'student',unlockWeek:parseInt(s.unlockWeek,10)||1};
  ST.teacher=false;
  var local={};
  try{local=JSON.parse(localStorage.getItem(STORE+':'+userKey())||'{}')||{};}catch(e){local={};}
  P=(s.progress&&typeof s.progress==='object'&&Object.keys(s.progress).length)?s.progress:local;
  try{localStorage.setItem(SESSION,JSON.stringify({name:s.name,code:code}));}catch(e){}
}
function setMsg(t){var m=$('lgMsg');if(m){m.textContent=t;}}
function afterLogin(){ST.view='map';readHash();render();window.scrollTo(0,0);loadMySubs();}
function doLogin(name,code,silent){
  name=String(name||'').trim();code=String(code||'').trim();
  if(!name||!code){if(silent){renderLogin();}return;}
  if(!API_URL){applyStudent({name:name,role:code.toLowerCase()==='gv'?'teacher':'student',unlockWeek:3},code);afterLogin();return;}
  setMsg('Đang kiểm tra...');
  api({action:'lr_login',name:name,code:code}).then(function(j){
    if(j.ok){applyStudent(j.student,code);afterLogin();}
    else{if(silent){try{localStorage.removeItem(SESSION);}catch(e){}renderLogin();}else{setMsg(j.error||'Tên hoặc mã lớp chưa đúng.');}}
  }).catch(function(){if(silent){renderLogin('Chưa kết nối được. Hãy thử lại.');}else{setMsg('Chưa kết nối được. Hãy thử lại.');}});
}
function logout(){
  recAbort();AUD={};MYSUBS={};
  try{localStorage.removeItem(SESSION);}catch(e){}
  ST.user=null;ST.teacher=false;ST.view='map';P={};
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  render();
}

/* ---------- chấm ---------- */
function findBlock(id){
  var p=id.split('.');var w=weekById(parseInt(p[0].slice(1),10));
  var s=secById(w,p[1]);return s.blocks[parseInt(p[2],10)];
}
function grade(el,store){
  var id=el.getAttribute('data-b');var b=findBlock(id);var type=el.getAttribute('data-t');
  var answers=[],ok=0;
  b.qs.forEach(function(q,i){
    var qel=el.querySelector('.q[data-i="'+i+'"]');var fb=qel.querySelector('.fb');var good=false,val=null,msg='';
    if(type==='mcq'){
      var r=qel.querySelector('input[type=radio]:checked');val=r?parseInt(r.value,10):null;good=(val===q.ans);
      var o=q.opts[q.ans];var t=typeof o==='string'?o:(o.l||('hình '+(q.ans+1)));
      msg=val===null?'Em chưa chọn.'+(ST.teacher?' Đáp án: '+t:''):(good?'Đúng rồi!'+(q.why?' '+q.why:''):'Chưa đúng, em thử lại nhé.'+(ST.teacher?' Đáp án: '+t+(q.why?'. '+q.why:''):''));
    }else{
      var inp=qel.querySelector('input.gap');val=inp.value;var n=norm(val);
      good=q.ans.some(function(x){return norm(x)===n;});
      msg=!n?'Em chưa điền.'+(ST.teacher?' Đáp án: '+q.ans[0]:''):(good?'Đúng rồi!':'Chưa đúng, em thử lại nhé.'+(ST.teacher?' Đáp án: '+q.ans[0]:''));
    }
    answers.push(val);if(good){ok++;}
    qel.classList.toggle('ok',good);qel.classList.toggle('bad',!good);fb.textContent=msg;
  });
  var sc=el.querySelector('.score');sc.textContent=ok+'/'+b.qs.length+(ok===b.qs.length?' · Tuyệt vời!':'');sc.classList.toggle('full',ok===b.qs.length);
  if(store){var tries=((P[id]||{}).t||0)+1;P[id]={a:answers,c:1,s:ok,n:b.qs.length,t:tries};save();sendResult(id,ok,b.qs.length,tries);}
}
function resetBlock(el){
  var id=el.getAttribute('data-b');
  el.querySelectorAll('.q').forEach(function(q){q.classList.remove('ok','bad');q.querySelector('.fb').textContent='';});
  el.querySelectorAll('input[type=radio]').forEach(function(r){r.checked=false;});
  el.querySelectorAll('input.gap').forEach(function(r){r.value='';});
  var sc=el.querySelector('.score');sc.textContent='';sc.classList.remove('full');
  delete P[id];save();
}

/* ---------- thu âm, viết bài và nộp cho giáo viên ---------- */
var SPEECH=window.SpeechRecognition||window.webkitSpeechRecognition;
var AUD={},RC=null,MYSUBS={},SUBS=null,SUBS_ERR='',LOCALSUBS='yle-subs-demo';
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function pickMime(){
  var c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i])){return c[i];}}catch(e){}}
  return '';
}
function nowText(){var d=new Date();function z(n){return (n<10?'0':'')+n;}return z(d.getHours())+':'+z(d.getMinutes())+' '+z(d.getDate())+'/'+z(d.getMonth()+1);}
function mmss(s){s=Math.floor(s);return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);}
function words(t){return norm(String(t||'').replace(/<[^>]+>/g,'')).replace(/[^a-z0-9' ]+/g,' ').split(' ').filter(Boolean);}
function lcsLen(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d.push(new Array(n+1).fill(0));}
  for(i=1;i<=m;i++){for(j=1;j<=n;j++){d[i][j]=(a[i-1]===b[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);}}
  return d[m][n];
}
function simScore(target,heard){var t=words(target),h=words(heard);return t.length?Math.round(lcsLen(t,h)/t.length*100):0;}
function sentCount(t){return String(t||'').split(/[.!?]+/).filter(function(x){return /[a-z]/i.test(x);}).length;}
function subTitle(id){
  var p=id.split('.'),w=weekById(parseInt(p[0].slice(1),10)),s=secById(w,p[1]),b=s.blocks[parseInt(p[2],10)];
  return w.title+' · '+s.tab+' · '+(b.title||'');
}
function sentHtml(id){
  var sub=(P[id]||{}).sub,my=MYSUBS[id],h='';
  if(sub){h+='<div class="sent">✓ Đã nộp cho cô lúc '+esc(sub.at)+(API_URL?'':' (chế độ thử, chỉ lưu trên máy này)')+'.</div>';}
  if(my&&my.comment){h+='<div class="cmt"><b>Nhận xét của cô:</b> '+esc(my.comment)+'</div>';}
  return h;
}
function blobToB64(blob){
  return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var s=String(fr.result);res(s.slice(s.indexOf(',')+1));};fr.onerror=rej;fr.readAsDataURL(blob);});
}
function sendSub(payload){
  if(!API_URL){
    var list=[];try{list=JSON.parse(localStorage.getItem(LOCALSUBS)||'[]')||[];}catch(e){}
    list=list.filter(function(x){return !(x.name===ST.user.name&&x.key===payload.key);});
    var rec={at:nowText(),name:ST.user.name,key:payload.key,title:payload.title,kind:payload.kind,text:payload.text||'',tr:payload.tr||'',score:payload.score||'',fileId:'',comment:''};
    list.unshift(rec);try{localStorage.setItem(LOCALSUBS,JSON.stringify(list.slice(0,100)));}catch(e){}
    return Promise.resolve({ok:true});
  }
  var body={name:ST.user.name,code:ST.user.code};for(var k in payload){body[k]=payload[k];}
  return api(body);
}
function sendResult(id,ok,n,tries){
  if(!API_URL||!ST.user||ST.teacher){return;}
  api({action:'lr_result',name:ST.user.name,code:ST.user.code,key:id,title:subTitle(id),score:ok,total:n,attempts:tries}).catch(function(){});
}
function markSent(id){P[id]=P[id]||{};P[id].sub={at:nowText()};save();}
function loadMySubs(){
  if(!API_URL||!ST.user){return;}
  api({action:'lr_subs',name:ST.user.name,code:ST.user.code}).then(function(j){
    if(j.ok){MYSUBS={};(j.subs||[]).forEach(function(s){MYSUBS[s.key]=s;});if(ST.view==='day'){refreshActs();}}
  }).catch(function(){});
}

/* --- ghi âm --- */
function recBox(id){return document.querySelector('.recbox[data-rec="'+id+'"]');}
function recReport(b,a){
  var h='',tr=a.tr||'',wc=words(tr).length;
  if(!tr){return '<div class="tips">Máy chưa nghe được chữ nào (hoặc trình duyệt không hỗ trợ chấm tự động). Cô vẫn nghe được file ghi âm của em khi em nộp.</div>';}
  h+='<div class="heard"><b>Máy nghe được:</b> "'+esc(tr)+'"</div>';
  var ok=0,items='';
  (b.kw||[]).forEach(function(k){var g=new RegExp(k.re,'i').test(tr);if(g){ok++;}items+='<li class="'+(g?'y':'n')+'">'+(g?'✓ ':'✗ ')+esc(k.l)+'</li>';});
  if(b.kw){items='<ul class="kwl">'+items+'</ul>';}
  var len=b.minWords?(wc>=b.minWords?'<div class="kok">Bài nói đủ dài ('+wc+' từ).</div>':'<div class="kno">Bài nói còn ngắn ('+wc+' từ). Em nói thêm khoảng '+(b.minWords-wc)+' từ nữa nhé.</div>'):'';
  return h+len+items;
}
function updateRec(id){
  var box=recBox(id);if(!box){return;}
  var b=findBlock(id),a=AUD[id],h='';
  if(!recSupported()){box.innerHTML='<div class="note">Trình duyệt này chưa hỗ trợ ghi âm. Em hãy mở trang bằng Chrome (máy tính, Android) hoặc Safari mới nhất (iPhone, iPad).</div>';return;}
  if(RC&&RC.id===id){
    h='<div class="recnow"><span class="dot"></span><b id="recTime">'+mmss((Date.now()-RC.t0)/1000)+'</b><span>Đang ghi âm... em nói chậm và rõ.</span></div><div class="actions"><button type="button" class="btn rec" data-act="recstop">Dừng</button></div>';
  }else{
    if(a){h+='<audio controls src="'+a.url+'"></audio>'+recReport(b,a);}
    h+='<div class="actions"><button type="button" class="btn '+(a?'ghost':'')+'" data-act="recstart">'+(a?'Ghi âm lại':'● Bắt đầu ghi âm')+'</button>'+(a?'<button type="button" class="btn" data-act="submit">Nộp cho cô</button>':'')+'<span class="score" id="sm-'+id+'" aria-live="polite"></span></div>';
  }
  box.innerHTML=h+sentHtml(id);
}
function recAbort(){
  if(!RC){return;}
  var rc=RC;RC=null;rc.live=false;clearInterval(rc.tick);
  try{rc.mr.onstop=null;rc.mr.stop();}catch(e){}
  try{rc.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  try{if(rc.sr){rc.sr.abort();}}catch(e){}
}
function recStart(id){
  stopAll();recAbort();
  var box=recBox(id);
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime=pickMime(),mr;
    try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mr=new MediaRecorder(stream);}
    var rc={id:id,mr:mr,stream:stream,chunks:[],tr:'',t0:Date.now(),sr:null,live:true,tick:null,mime:mr.mimeType||mime||'audio/webm'};
    mr.ondataavailable=function(e){if(e.data&&e.data.size){rc.chunks.push(e.data);}};
    mr.onstop=function(){
      setTimeout(function(){
        var blob=new Blob(rc.chunks,{type:rc.mime});
        if(AUD[id]&&AUD[id].url){try{URL.revokeObjectURL(AUD[id].url);}catch(e){}}
        AUD[id]={blob:blob,url:URL.createObjectURL(blob),tr:norm(rc.tr),dur:Math.round((Date.now()-rc.t0)/1000),mime:rc.mime};
        updateRec(id);
      },700);
    };
    RC=rc;mr.start();
    if(SPEECH){
      try{
        var r=new SPEECH();r.lang='en-GB';r.continuous=true;r.interimResults=false;
        r.onresult=function(ev){for(var i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal){rc.tr+=' '+ev.results[i][0].transcript;}}};
        r.onend=function(){if(rc.live&&RC===rc){try{r.start();}catch(e){}}};
        r.onerror=function(){};
        r.start();rc.sr=r;
      }catch(e){rc.sr=null;}
    }
    rc.tick=setInterval(function(){
      var s=(Date.now()-rc.t0)/1000,el=$('recTime');if(el){el.textContent=mmss(s);}
      if(s>=90){recStop();}
    },500);
    updateRec(id);
  }).catch(function(err){
    var m=(err&&(err.name==='NotAllowedError'||err.name==='SecurityError'))?'Em hãy cho phép trình duyệt dùng micro (bấm vào biểu tượng ổ khóa cạnh địa chỉ trang), rồi thử lại.':'Chưa mở được micro. Hãy kiểm tra micro rồi thử lại.';
    if(box){box.insertAdjacentHTML('afterbegin','<div class="note">'+m+'</div>');}
  });
}
function recStop(){
  if(!RC){return;}
  var rc=RC;rc.live=false;clearInterval(rc.tick);
  try{if(rc.sr){rc.sr.stop();}}catch(e){}
  try{rc.mr.stop();}catch(e){}
  try{rc.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  RC=null;
  var box=recBox(rc.id);if(box){box.innerHTML='<div class="muted">Đang xử lý bản ghi âm...</div>';}
}
function submitRec(id,btn){
  var a=AUD[id],b=findBlock(id),sm=$('sm-'+id);if(!a){return;}
  if(a.dur<5){if(sm){sm.textContent='Bài ghi âm quá ngắn. Em nói thêm rồi nộp nhé.';}return;}
  btn.disabled=true;if(sm){sm.textContent='Đang gửi cho cô...';}
  var ok=0;(b.kw||[]).forEach(function(k){if(new RegExp(k.re,'i').test(a.tr||'')){ok++;}});
  var score=(b.kw?('Từ khóa '+ok+'/'+b.kw.length+' · '):'')+words(a.tr).length+' từ · '+a.dur+' giây';
  var payload={action:'lr_submit',key:id,title:subTitle(id),kind:'speak',text:'',tr:a.tr||'',score:score,dur:a.dur,mime:a.mime};
  (API_URL?blobToB64(a.blob).then(function(x){payload.audio=x;return sendSub(payload);}):sendSub(payload))
  .then(function(j){
    if(j&&j.ok){markSent(id);updateRec(id);}
    else{btn.disabled=false;if(sm){sm.textContent='Chưa gửi được: '+((j&&j.error)||'lỗi')+'. Em thử lại nhé.';}}
  }).catch(function(){btn.disabled=false;if(sm){sm.textContent='Chưa gửi được. Hãy kiểm tra mạng rồi thử lại.';}});
}

/* --- viết bài --- */
function writeStat(b,t){
  var n=sentCount(t),h='<div class="'+(n>=b.min?'kok':'kno')+'">Số câu: '+n+'/'+b.min+' câu trở lên · '+words(t).length+' từ</div><ul class="kwl">';
  (b.kw||[]).forEach(function(k){var g=new RegExp(k.re,'i').test(t);h+='<li class="'+(g?'y':'n')+'">'+(g?'✓ ':'✗ ')+esc(k.l)+'</li>';});
  return h+'</ul>';
}
function updateWrite(id){
  var el=document.querySelector('[data-w="'+id+'"]');if(!el){return;}
  var b=findBlock(id),t=(P[id]||{}).txt||'';
  var st=document.querySelector('.wstat[data-for="'+id+'"]');if(st){st.innerHTML=writeStat(b,t);}
  var sd=document.querySelector('.wsent[data-for="'+id+'"]');if(sd){sd.innerHTML=sentHtml(id);}
  var mo=document.querySelector('.wmodel[data-for="'+id+'"]');if(mo){mo.hidden=!(P[id]&&P[id].sub);}
}
function submitWrite(id,btn){
  var b=findBlock(id),t=((P[id]||{}).txt||'').trim(),sm=$('sm-'+id);
  var n=sentCount(t);
  if(n<b.min){if(sm){sm.textContent='Em viết thêm cho đủ '+b.min+' câu rồi nộp nhé.';}return;}
  btn.disabled=true;if(sm){sm.textContent='Đang gửi cho cô...';}
  var ok=0;(b.kw||[]).forEach(function(k){if(new RegExp(k.re,'i').test(t)){ok++;}});
  sendSub({action:'lr_submit',key:id,title:subTitle(id),kind:'write',text:t,tr:'',score:'Tiêu chí '+ok+'/'+(b.kw||[]).length+' · '+n+' câu · '+words(t).length+' từ'})
  .then(function(j){
    btn.disabled=false;
    if(j&&j.ok){markSent(id);if(sm){sm.textContent='';}updateWrite(id);}
    else if(sm){sm.textContent='Chưa gửi được: '+((j&&j.error)||'lỗi')+'. Em thử lại nhé.';}
  }).catch(function(){btn.disabled=false;if(sm){sm.textContent='Chưa gửi được. Hãy kiểm tra mạng rồi thử lại.';}});
}

/* --- nghe và nhắc lại có chấm điểm --- */
function shadowShow(id,i){
  var r=((P[id]||{}).sh||{})[i],el=document.querySelector('.shres[data-for="'+id+'-'+i+'"]');if(!el){return;}
  if(!r){el.innerHTML='';return;}
  el.innerHTML='<span class="shp '+(r.p>=80?'g':(r.p>=50?'m':'l'))+'">'+r.p+'%</span> <span class="muted">Máy nghe được: "'+esc(r.h||'')+'"</span>';
}
function shadowSummary(id){
  var b=findBlock(id),sh=(P[id]||{}).sh||{},done=0,sum=0,lines=[];
  b.items.forEach(function(it,i){var r=sh[i];if(r){done++;sum+=r.p;}lines.push((i+1)+'. '+auText(it.au)+' → '+(r?r.p+'% ("'+r.h+'")':'chưa nói'));});
  return {done:done,avg:done?Math.round(sum/done):0,text:lines.join('\n')};
}
function shadowRec(id,i,btn){
  stopAll();recAbort();
  var res=document.querySelector('.shres[data-for="'+id+'-'+i+'"]');
  if(!SPEECH){res.innerHTML='<div class="tips">Trình duyệt này chưa hỗ trợ chấm tự động. Hãy mở bằng Chrome (máy tính, Android) hoặc Safari mới nhất.</div>';return;}
  if(SHREC){try{SHREC.abort();}catch(e){}SHREC=null;}
  var b=findBlock(id),target=auText(b.items[i].au),r=new SPEECH(),got=false;
  r.lang='en-GB';r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  SHREC=r;btn.classList.add('on');btn.textContent='Đang nghe...';res.innerHTML='';
  r.onresult=function(ev){
    got=true;var best=-1,heard='',list=ev.results[0];
    for(var j=0;j<list.length;j++){var sc=simScore(target,list[j].transcript);if(sc>best){best=sc;heard=norm(list[j].transcript);}}
    P[id]=P[id]||{};P[id].sh=P[id].sh||{};
    var old=P[id].sh[i];if(!old||best>=old.p){P[id].sh[i]={p:best,h:heard};}
    save();shadowShow(id,i);
  };
  r.onerror=function(ev){got=true;if(!ev||ev.error!=='aborted'){res.innerHTML='<div class="tips">'+((ev&&ERRTXT[ev.error])||'Chưa ghi âm được. Hãy thử lại.')+'</div>';}};
  r.onend=function(){btn.classList.remove('on');btn.innerHTML=IH('🎤')+' Nói';if(SHREC===r){SHREC=null;}if(!got){res.innerHTML='<div class="tips">Cô chưa nghe thấy giọng em. Hãy thử lại.</div>';}};
  try{r.start();}catch(e){btn.classList.remove('on');btn.innerHTML=IH('🎤')+' Nói';SHREC=null;}
}
var SHREC=null;
var ERRTXT={'not-allowed':'Em hãy cho phép trình duyệt dùng micro rồi thử lại.','service-not-allowed':'Em hãy cho phép trình duyệt dùng micro rồi thử lại.','no-speech':'Cô chưa nghe thấy giọng em. Hãy nói to hơn một chút.','audio-capture':'Chưa tìm thấy micro. Hãy kiểm tra micro.','network':'Chấm điểm cần có mạng. Hãy kiểm tra mạng rồi thử lại.'};
function submitShadow(id,btn){
  var s=shadowSummary(id),sm=$('sm-'+id);
  if(s.done<1){if(sm){sm.textContent='Em hãy nói ít nhất một câu rồi nộp nhé.';}return;}
  btn.disabled=true;if(sm){sm.textContent='Đang gửi cho cô...';}
  sendSub({action:'lr_submit',key:id,title:subTitle(id),kind:'shadow',text:s.text,tr:'',score:'Trung bình '+s.avg+'% · '+s.done+'/'+findBlock(id).items.length+' câu'})
  .then(function(j){
    btn.disabled=false;
    if(j&&j.ok){markSent(id);if(sm){sm.textContent='';}var sd=document.querySelector('.wsent[data-for="'+id+'"]');if(sd){sd.innerHTML=sentHtml(id);}}
    else if(sm){sm.textContent='Chưa gửi được: '+((j&&j.error)||'lỗi')+'. Em thử lại nhé.';}
  }).catch(function(){btn.disabled=false;if(sm){sm.textContent='Chưa gửi được. Hãy kiểm tra mạng rồi thử lại.';}});
}
function refreshActs(){
  document.querySelectorAll('.recbox').forEach(function(el){updateRec(el.getAttribute('data-rec'));});
  document.querySelectorAll('[data-w]').forEach(function(el){updateWrite(el.getAttribute('data-w'));});
  document.querySelectorAll('.shblk').forEach(function(el){
    var id=el.getAttribute('data-sh'),b=findBlock(id);
    b.items.forEach(function(it,i){shadowShow(id,i);});
    var sd=el.querySelector('.wsent');if(sd){sd.innerHTML=sentHtml(id);}
  });
}

/* --- giáo viên xem bài nộp --- */
function loadSubs(){
  SUBS=null;SUBS_ERR='';render();
  if(!API_URL){try{SUBS=JSON.parse(localStorage.getItem(LOCALSUBS)||'[]')||[];}catch(e){SUBS=[];}render();return;}
  api({action:'lr_subs',name:ST.user.name,code:ST.user.code}).then(function(j){
    if(j.ok){SUBS=j.subs||[];}else{SUBS_ERR=j.error||'Không tải được bài nộp.';}
    render();
  }).catch(function(){SUBS_ERR='Chưa kết nối được Google Sheet.';render();});
}
function renderSubs(){
  var h='<div class="wrap">'+topbar()+'<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>Bài nộp của học sinh</b><button type="button" class="btn sm" data-act="refreshsubs">Tải lại</button></div></div><main class="stack">';
  if(SUBS_ERR){h+='<div class="note">'+esc(SUBS_ERR)+'</div>';}
  else if(SUBS===null){h+='<p class="muted">Đang tải bài nộp...</p>';}
  else if(!SUBS.length){h+='<section class="blk"><p class="muted">Chưa có bài nộp nào.</p></section>';}
  else{
    SUBS.forEach(function(s,i){
      var k=s.kind==='speak'?'Nói':(s.kind==='write'?'Viết':'Nghe và nhắc lại');
      h+='<section class="blk subcard" data-si="'+i+'"><div class="subhead"><b>'+esc(s.name)+'</b><span class="pill">'+k+'</span><span class="muted">'+esc(s.at||'')+'</span></div><div>'+esc(s.title)+'</div>';
      if(s.score){h+='<div class="muted">Điểm máy: '+esc(s.score)+'</div>';}
      if(s.kind==='speak'){
        h+='<div class="subaud" id="aud-'+i+'">';
        if(AUD[s.key]&&!API_URL){h+='<audio controls src="'+AUD[s.key].url+'"></audio>';}
        else if(s.fileId){h+='<button type="button" class="btn ghost sm" data-act="subaudio" data-i="'+i+'">▶ Tải và nghe bài nói</button>';}
        else{h+='<span class="muted">Không có file ghi âm.</span>';}
        h+='</div>';
        if(s.tr){h+='<div class="heard"><b>Máy nghe được:</b> "'+esc(s.tr)+'"</div>';}
      }
      if(s.text){h+='<pre class="subtxt">'+esc(s.text)+'</pre>';}
      h+='<label class="f">Nhận xét của cô<textarea class="wr" rows="2" id="cm-'+i+'">'+esc(s.comment||'')+'</textarea></label><div class="actions"><button type="button" class="btn sm" data-act="subcomment" data-i="'+i+'">Lưu nhận xét</button><span class="score" id="cs-'+i+'" aria-live="polite"></span></div></section>';
    });
  }
  $('app').innerHTML=h+'</main></div>';
}
function subAudio(i,btn){
  var s=SUBS[i],box=$('aud-'+i);btn.disabled=true;btn.textContent='Đang tải...';
  api({action:'lr_audio',name:ST.user.name,code:ST.user.code,id:s.fileId}).then(function(j){
    if(!j.ok){box.innerHTML='<span class="muted">'+esc(j.error||'Không tải được file.')+'</span>';return;}
    var bin=atob(j.data),u8=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++){u8[k]=bin.charCodeAt(k);}
    var url=URL.createObjectURL(new Blob([u8],{type:j.mime||'audio/webm'}));
    box.innerHTML='<audio controls autoplay src="'+url+'"></audio>';
  }).catch(function(){btn.disabled=false;btn.textContent='▶ Tải và nghe bài nói';});
}
function saveComment(i,btn){
  var s=SUBS[i],v=$('cm-'+i).value,cs=$('cs-'+i);s.comment=v;
  if(!API_URL){
    try{var l=JSON.parse(localStorage.getItem(LOCALSUBS)||'[]');l.forEach(function(x){if(x.name===s.name&&x.key===s.key){x.comment=v;}});localStorage.setItem(LOCALSUBS,JSON.stringify(l));}catch(e){}
    cs.textContent='Đã lưu';return;
  }
  cs.textContent='Đang lưu...';
  api({action:'lr_comment',name:ST.user.name,code:ST.user.code,student:s.name,key:s.key,comment:v}).then(function(j){cs.textContent=j.ok?'Đã lưu':(j.error||'Chưa lưu được');}).catch(function(){cs.textContent='Chưa lưu được';});
}


/* ---------- đường dẫn ---------- */
function setHash(){
  try{
    if(ST.view==='day'){history.replaceState(null,'','#w'+ST.week+'-'+ST.sec);}
    else{history.replaceState(null,'',location.pathname+location.search);}
  }catch(e){}
}
function readHash(){
  var m=/^#w(\d+)-([a-z0-9]+)$/.exec(location.hash||'');
  if(!m||!ST.user){return;}
  var wid=parseInt(m[1],10),w=weekById(wid);
  if(!w||isLocked(wid)){return;}
  if(m[2]==='script'){if(!ST.teacher){return;}}
  else if(!secById(w,m[2])){return;}
  ST.week=wid;ST.sec=m[2];ST.view='day';
}

document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='loginForm'){e.preventDefault();doLogin($('lgName').value,$('lgCode').value,false);}
});
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest){return;}
  var au=t.closest('[data-au]');if(au){playAu(au);return;}
  var op=t.closest('[data-open]');if(op){
    var m=/^w(\d+)-([a-z0-9]+)$/.exec(op.getAttribute('data-open'));
    if(m&&!isLocked(parseInt(m[1],10))){ST.week=parseInt(m[1],10);ST.sec=m[2];ST.view='day';setHash();render();window.scrollTo(0,0);}
    return;
  }
  var md=t.closest('[data-mode]');if(md){ST.teacher=(md.getAttribute('data-mode')==='t');render();return;}
  var ac=t.closest('[data-act]');if(!ac){return;}
  var act=ac.getAttribute('data-act');var blk=ac.closest('[data-b]');
  if(act==='check'&&blk){grade(blk,true);}
  else if(act==='reset'&&blk){resetBlock(blk);}
  else if(act==='back'){ST.view='map';setHash();render();window.scrollTo(0,0);}
  else if(act==='logout'){logout();}
  else if(act==='class'){ST.view='class';loadClass();window.scrollTo(0,0);}
  else if(act==='refreshclass'){loadClass();}
  else if(act==='subs'||act==='refreshsubs'){ST.view='subs';loadSubs();window.scrollTo(0,0);}
  else if(act==='subaudio'){subAudio(parseInt(ac.getAttribute('data-i'),10),ac);}
  else if(act==='subcomment'){saveComment(parseInt(ac.getAttribute('data-i'),10),ac);}
  else if(act==='recstart'&&blk){recStart(blk.getAttribute('data-b'));}
  else if(act==='recstop'){recStop();}
  else if(act==='submit'&&blk){submitRec(blk.getAttribute('data-b'),ac);}
  else if(act==='wsubmit'&&blk){submitWrite(blk.getAttribute('data-b'),ac);}
  else if(act==='shrec'){var sb=ac.closest('[data-sh]');shadowRec(sb.getAttribute('data-sh'),parseInt(ac.getAttribute('data-i'),10),ac);}
  else if(act==='shsubmit'){submitShadow(ac.getAttribute('data-sid'),ac);}
  else if(act==='done'){
    var key='w'+ST.week+'.'+ST.sec,dm=doneMap(),btn=$('doneBtn'),msg=$('doneMsg');
    if(dm[key]){delete dm[key];btn.textContent='Hoàn thành ngày học';msg.textContent='';}
    else{dm[key]=Date.now();btn.textContent='Bỏ đánh dấu đã xong';msg.textContent='Giỏi lắm! Em đã hoàn thành ngày này.';}
    save();
  }
  else if(act==='copyscript'){
    var txt=scriptText(weekObj());var sm=$('scriptMsg');
    try{navigator.clipboard.writeText(txt).then(function(){sm.textContent='Đã sao chép';},function(){sm.textContent='Không sao chép được. Hãy chọn và sao chép thủ công.';});}
    catch(err){sm.textContent='Không sao chép được. Hãy chọn và sao chép thủ công.';}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-w')){
    var id=t.getAttribute('data-w');P[id]=P[id]||{};P[id].txt=t.value;save();
    var b=findBlock(id),st=document.querySelector('.wstat[data-for="'+id+'"]');if(st){st.innerHTML=writeStat(b,t.value);}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.type==='checkbox'){
    var blk=t.closest('[data-b]');if(!blk){return;}
    var id=blk.getAttribute('data-b');var arr=[];
    blk.querySelectorAll('input[type=checkbox]').forEach(function(c){arr.push(c.checked?1:0);});
    P[id]=P[id]||{};P[id].a=arr;save();
  }
});
window.addEventListener('hashchange',function(){if(ST.user){ST.view='map';readHash();render();}});

/* ---------- khởi động ---------- */
(function(){
  var s=null;
  try{s=JSON.parse(localStorage.getItem(SESSION)||'null');}catch(e){s=null;}
  if(s&&s.name&&s.code){
    if(API_URL){$('app').innerHTML='<div class="wrap"><p class="muted" style="padding:40px 4px">Đang vào lớp...</p></div>';}
    doLogin(s.name,s.code,true);
  }else{renderLogin();}
})();
})();

</script>
<script>
/* ===== Hoạt động học (roadmap-learn) ===== */
(function(){
"use strict";
if(window.__lk){return;}window.__lk=1;

var CSS=[
".lk-hide{display:none!important}",

".lk-exb{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:1.05rem;font-weight:700;color:var(--ink)}",

".lk-w.in{background:var(--surface);color:var(--ink);border-color:var(--line)}",
".lk-w:disabled{cursor:default;opacity:.8}",
".lk-mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}",
".lk-c{min-height:88px;border:2px solid var(--accent);border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.15rem;padding:6px;display:grid;place-items:center}",
".lk-c.up{background:var(--surface);color:var(--ink)}",
".lk-c.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}",
".lk-ln{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}",
".lk-ln.mine{background:var(--accent-soft);border-color:var(--accent)}",
".lk-t{flex:1 1 220px;font-weight:700;overflow-wrap:anywhere}",
".lk-who{color:var(--lvl)}"
].join("");
var stl=document.createElement("style");stl.textContent=CSS;document.head.appendChild(stl);

/* ---------- tiện ích ---------- */
var cur=null;
function speak(t){
  try{var s=window.speechSynthesis;if(!s||typeof SpeechSynthesisUtterance==="undefined"){return}
    s.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;
    var v=s.getVoices().filter(function(x){return /^en[-_]GB/i.test(x.lang)})[0];if(v){u.voice=v}
    s.speak(u);}catch(e){}
}
function say(t){
  try{if(window.speechSynthesis){window.speechSynthesis.cancel()}if(cur){cur.pause();cur=null}}catch(e){}
  var used=false;function fb(){if(!used){used=true;speak(t)}}
  try{
    if(typeof window.aid!=="function"||typeof window.A!=="function"){fb();return}
    var a=new Audio("audio/"+window.aid(window.A(t))+".mp3");cur=a;
    a.addEventListener("error",fb);
    var p=a.play();if(p&&p.catch){p.catch(fb)}
  }catch(e){fb()}
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls){e.className=cls}if(txt!=null){if(window.hasEm&&hasEm(txt)){e.innerHTML=window.IHT(txt)}else{e.textContent=txt}}return e}
function strip(h){return String(h).replace(/<[^>]+>/g,"")}
function shuf(a){var b=a.slice(),j,t;for(var k=b.length-1;k>0;k--){j=Math.floor(Math.random()*(k+1));t=b[k];b[k]=b[j];b[j]=t}return b}
function sample(a,n){return shuf(a).slice(0,n)}
function wd(t){return String(t||"").toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(" ").filter(Boolean)}
function lcs(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d.push(new Array(n+1).fill(0))}
  for(i=1;i<=m;i++){for(j=1;j<=n;j++){d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1])}}return d[m][n]}
function sim(t,h){var a=wd(t),b=wd(h);return a.length?Math.round(lcs(a,b)/a.length*100):0}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}

/* hình cho từ vựng: hiện biểu tượng, nếu có ảnh images/vocab-xxx.jpg thì thay bằng ảnh */
function pic(it){
  var s=mk("span","lk-pic");
  if(typeof window.iconSvg==="function"){s.innerHTML=window.iconSvg(it.icon,it.c,"ico")}else{s.textContent=String(it.icon)}
  var img=new Image();img.alt="";
  img.onload=function(){s.innerHTML="";s.appendChild(img)};
  img.src="images/vocab-"+slug(it.w)+".jpg";
  return s;
}

/* ---------- khung trò chơi dùng chung ---------- */
function summary(fin,first,n,again){
  fin.hidden=false;fin.innerHTML="";
  fin.appendChild(mk("p","lk-line","⭐ Giỏi lắm! Em làm đúng "+first+"/"+n+" câu ngay từ lần đầu."));
  var b=mk("button","btn ghost sm","Chơi lại");b.type="button";b.addEventListener("click",again);fin.appendChild(b);
}

/* bấm các ô để xếp theo thứ tự (câu, chữ cái) */
function chips(body,rounds){
  var i=0,first=0,tried=false,ok=false,r=null,order=[],sel=[];
  body.innerHTML='<p class="muted lk-prog"></p><div class="lk-rp"></div><div class="lk-ans" aria-live="polite"></div><div class="lk-bank"></div><div class="lk-fb" aria-live="polite"></div><div class="actions"><button type="button" class="btn sm lk-chk">Kiểm tra</button><button type="button" class="btn ghost sm lk-rs">Làm lại</button><button type="button" class="btn sm lk-nx" hidden>Tiếp →</button></div><div class="lk-fin" hidden></div>';
  function q(s){return body.querySelector(s)}
  var prog=q(".lk-prog"),rp=q(".lk-rp"),ans=q(".lk-ans"),bank=q(".lk-bank"),fb=q(".lk-fb"),
      chk=q(".lk-chk"),rs=q(".lk-rs"),nx=q(".lk-nx"),fin=q(".lk-fin"),acts=q(".actions");
  var parts=[prog,rp,ans,bank,fb,acts];
  function clr(){fb.className="lk-fb";fb.textContent=""}
  function draw(){
    ans.className="lk-ans"+(ok?" ok":"");ans.innerHTML="";bank.innerHTML="";
    sel.forEach(function(k,pos){
      var b=mk("button","lk-w in",r.tokens[k]);b.type="button";b.disabled=ok;
      b.addEventListener("click",function(){sel.splice(pos,1);clr();draw()});ans.appendChild(b);
    });
    order.forEach(function(k){
      if(sel.indexOf(k)>-1){return}
      var b=mk("button","lk-w",r.tokens[k]);b.type="button";
      b.addEventListener("click",function(){sel.push(k);clr();draw()});bank.appendChild(b);
    });
  }
  function load(){
    r=rounds[i];sel=[];tried=false;ok=false;
    var n=r.tokens.length,tries=0,k;order=[];for(k=0;k<n;k++){order.push(k)}
    do{order=shuf(order);tries++}while(tries<10&&n>1&&order.every(function(v,x){return v===x}));
    prog.textContent="Câu "+(i+1)+"/"+rounds.length;
    rp.innerHTML="";
    if(r.pic){rp.appendChild(r.pic())}
    if(r.label){rp.appendChild(mk("div","lk-line",r.label))}
    if(r.audio){
      var au=r.audio,pb=mk("button","btn ghost sm","🔊 Nghe");pb.type="button";
      pb.addEventListener("click",function(){say(au)});rp.appendChild(pb);
      if(i>0){say(au)}
    }
    clr();chk.hidden=false;rs.hidden=false;nx.hidden=true;draw();
  }
  chk.addEventListener("click",function(){
    if(sel.length<r.tokens.length){fb.className="lk-fb bad";fb.textContent="Em xếp đủ tất cả các ô rồi bấm Kiểm tra nhé.";return}
    var s=sel.map(function(k){return r.tokens[k]}).join(r.sep);
    if(s===r.target){
      ok=true;if(!tried){first++}
      fb.className="lk-fb ok";fb.textContent="Đúng rồi!";
      chk.hidden=true;rs.hidden=true;nx.hidden=false;
      nx.textContent=(i<rounds.length-1)?"Tiếp →":"Xem kết quả";
      draw();if(r.sayOk){say(r.sayOk)}
    }else{
      tried=true;ans.classList.add("bad");fb.className="lk-fb bad";fb.textContent="Chưa đúng, em thử sắp xếp lại nhé.";
    }
  });
  rs.addEventListener("click",function(){sel=[];clr();draw()});
  nx.addEventListener("click",function(){
    i++;
    if(i<rounds.length){load();return}
    parts.forEach(function(e){e.hidden=true});
    summary(fin,first,rounds.length,function(){i=0;first=0;fin.hidden=true;parts.forEach(function(e){e.hidden=false});load()});
  });
  load();
}

/* chọn một đáp án: đáp án là chữ hoặc hình */
function choice(body,qs){
  var i=0,first=0,tried=false,done=false;
  body.innerHTML='<p class="muted lk-prog"></p><div class="lk-rp"></div><div class="lk-os"></div><div class="lk-fb" aria-live="polite"></div><div class="actions"><button type="button" class="btn sm lk-nx" hidden>Tiếp →</button></div><div class="lk-fin" hidden></div>';
  function q(s){return body.querySelector(s)}
  var prog=q(".lk-prog"),rp=q(".lk-rp"),os=q(".lk-os"),fb=q(".lk-fb"),nx=q(".lk-nx"),fin=q(".lk-fin"),acts=q(".actions");
  var parts=[prog,rp,os,fb,acts];
  function load(){
    var x=qs[i];done=false;tried=false;
    prog.textContent="Câu "+(i+1)+"/"+qs.length;
    rp.innerHTML="";rp.appendChild(mk("div","lk-line",x.q));
    if(x.audio){
      var au=x.audio,pb=mk("button","btn ghost sm","🔊 Nghe");pb.type="button";
      pb.addEventListener("click",function(){say(au)});rp.appendChild(pb);
      if(i>0){say(au)}
    }
    fb.className="lk-fb";fb.textContent="";nx.hidden=true;os.innerHTML="";
    x.opts.forEach(function(o,k){
      var b=mk("button","lk-o");b.type="button";
      if(typeof o==="function"){b.className="lk-o lk-tile";b.appendChild(o())}else{b.textContent=o}
      b.addEventListener("click",function(){
        if(done){return}
        if(k===x.a){
          done=true;b.classList.add("ok");if(!tried){first++}
          fb.className="lk-fb ok";fb.textContent="Đúng rồi!";
          nx.hidden=false;nx.textContent=(i<qs.length-1)?"Tiếp →":"Xem kết quả";
          if(x.say){say(x.say)}
        }else{

function pool(main){

    raw.push(el.textContent.replace(/\s+/g," ").trim());
  });

  raw.forEach(function(s){
    var w=s.split(" ");
    if(w.length>=3&&w.length<=9&&/^[A-Za-z][A-Za-z' ,.!?]*[.!?]$/.test(s)&&!seen[s]){seen[s]=1;c.push(s)}
  });
  return c;
}
var RX=/^([^A-Za-z']*)([A-Za-z']+)([^A-Za-z']*)$/;
function clozeQs(pl){
  var all=[];
  pl.forEach(function(s){s.split(" ").forEach(function(w){
    var m=/[A-Za-z']+/.exec(w);
    if(m&&m[0].length>1&&all.indexOf(m[0].toLowerCase())<0){all.push(m[0].toLowerCase())}
  })});
  return sample(pl,5).map(function(s){
    var ws=s.split(" "),idx=[];
    ws.forEach(function(w,k){var m=RX.exec(w);if(k>0&&m&&m[2].length>1){idx.push(k)}});
    var k=idx.length?idx[Math.floor(Math.random()*idx.length)]:1;
    var m=RX.exec(ws[k])||[ws[k],"",ws[k],""];
    var core=m[2],low=core.toLowerCase();
    var shown=ws.slice();shown[k]=m[1]+"_____"+m[3];
    var d=sample(all.filter(function(x){return x!==low}),2);
    var opts=shuf([core].concat(d));
    return {q:shown.join(" "),say:s,opts:opts,a:opts.indexOf(core)};
  });
}
function pickQs(pl){
  return sample(pl,5).map(function(s){
    var d=sample(pl.filter(function(x){return x!==s}),2);
    var opts=shuf([s].concat(d));
    return {q:"Em nghe thấy câu nào?",audio:s,opts:opts,a:opts.indexOf(s)};
  });
}

function listenOnce(target,done){
  var R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){done(-3,"");return}
  try{if(window.speechSynthesis){window.speechSynthesis.cancel()}if(cur){cur.pause()}}catch(e){}
  var r=new R(),got=false;
  r.lang="en-GB";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  r.onresult=function(ev){
    got=true;var best=-1,heard="",l=ev.results[0];
    for(var j=0;j<l.length;j++){var sc=sim(target,l[j].transcript);if(sc>best){best=sc;heard=l[j].transcript}}
    done(best,heard);
  };
  r.onerror=function(){if(!got){got=true;done(-1,"")}};
  r.onend=function(){if(!got){got=true;done(-2,"")}};
  try{r.start()}catch(e){got=true;done(-1,"")}
}

  ];
  function tabDiff(p){
    var found=[],NS="http://www.w3.org/2000/svg",svgs=[];
    var head=mk("div","in-cap"),msg=mk("b",null,""),list=mk("ul","in-found"),pair=mk("div","in-pair"),ctl=mk("div","actions");
    head.appendChild(mk("div","in-vi","Hai bức tranh cùng một nơi: một buổi sáng, một buổi tối. Em bấm vào chỗ khác nhau nhé."));
    head.appendChild(msg);
    function upd(){
      var n=found.filter(Boolean).length;
      msg.textContent="Em đã tìm được "+n+"/"+DIFFS.length+" điểm khác nhau"+(n===DIFFS.length?" ":"");
      if(n===DIFFS.length){
        list.appendChild(mk("li",null,"Tranh A là buổi sáng: Good morning. Tranh B là buổi tối: Good evening."));
        learn("Good morning");learn("Good evening");
      }
    }
    function addRect(g,r,cls){
      var e=document.createElementNS(NS,"rect");
      e.setAttribute("x",r[0]);e.setAttribute("y",r[1]);e.setAttribute("width",r[2]);e.setAttribute("height",r[3]);e.setAttribute("rx",8);
      if(cls){e.setAttribute("class",cls);}
      g.appendChild(e);return e;
    }
    function make(night,label){
      var w=mk("div","in-pic"),b=mk("b",null,label),bx=mk("div","scenebox");
      bx.innerHTML=street(night);
      var svg=bx.querySelector("svg"),g=document.createElementNS(NS,"g"),rings=document.createElementNS(NS,"g");
      g.setAttribute("class","in-hs");
      DIFFS.forEach(function(d,i){
        var e=addRect(g,d.r);e.setAttribute("data-i",i);e.setAttribute("tabindex","0");e.setAttribute("role","button");e.setAttribute("aria-label","Điểm khác nhau");
      });
      svg.appendChild(g);svg.appendChild(rings);
      svgs.push({g:g,rings:rings});
      function act(e){
        var t=e.target.closest&&e.target.closest("rect");if(!t||t.getAttribute("data-i")==null){return;}
        pick(+t.getAttribute("data-i"));
      }
      g.addEventListener("click",act);
      g.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();act(e);}});
      w.appendChild(b);w.appendChild(bx);
      return w;
    }
    function pick(i){
      if(found[i]){return;}
      found[i]=true;
      svgs.forEach(function(s){addRect(s.rings,DIFFS[i].r,"in-ring");});
      list.appendChild(mk("li",null,""+DIFFS[i].t));
      if(DIFFS[i].say){say(DIFFS[i].say);}
      (DIFFS[i].learn||[]).forEach(learn);
      upd();
    }
    pair.appendChild(make(false,"Tranh A"));pair.appendChild(make(true,"Tranh B"));
    ctl.appendChild(btn("Gợi ý","btn ghost sm",function(){
      var i=0;while(i<DIFFS.length&&found[i]){i++;}
      if(i>=DIFFS.length){return;}
      var fl=[];
      svgs.forEach(function(s){fl.push(addRect(s.rings,DIFFS[i].r,"in-flash"));});
      setTimeout(function(){fl.forEach(function(e){if(e.parentNode){e.parentNode.removeChild(e);}});},1600);
    }));
    upd();
    p.appendChild(head);p.appendChild(pair);p.appendChild(ctl);p.appendChild(list);
  }

  /* ---- ghép lại ---- */
  var TABS=[["Xem hoạt hình",tabStory],["Mặt trời và đồng hồ",tabSun],["Tìm điểm khác nhau",tabDiff]],tbs=[];
  function show(i){
    stop();panel.innerHTML="";
    tbs.forEach(function(t,k){t.setAttribute("aria-selected",k===i?"true":"false");});
    TABS[i][1](panel);
  }
  TABS.forEach(function(t,i){
    var b=mk("button","in-tab",t[0]);b.type="button";b.setAttribute("role","tab");
    b.addEventListener("click",function(){show(i);});
    tbs.push(b);tabs.appendChild(b);
  });
  tabs.setAttribute("role","tablist");
  card.appendChild(h3);card.appendChild(intro);card.appendChild(tabs);card.appendChild(panel);
  card.appendChild(cnt);card.appendChild(book);
  main.insertBefore(card,anchor);
  renderBook();show(0);
}

/* ---------- chạy khi trang vẽ Ngày 1 của tuần 2 ---------- */
function isTeacher(){
  var b=document.querySelector('.seg button[data-mode="t"]');
  return !!(b&&b.getAttribute("aria-pressed")==="true");
}
function enhance(){
  var main=document.querySelector("main.stack");
  if(!main||main.getAttribute("data-intro")||!main.querySelector(".sechead")||isTeacher()){return;}
  if(location.hash!=="#w2-d1"){return;}
  if(typeof window.kid!=="function"||typeof window.sceneWrap!=="function"){return;}
  main.setAttribute("data-intro","1");
  build(main);
}
var app=document.getElementById("app"),timer=null;
if(app){new MutationObserver(function(){clearTimeout(timer);timer=setTimeout(enhance,80);}).observe(app,{childList:true,subtree:true});}
window.addEventListener("hashchange",function(){stop();});
enhance();
})();

</script>
</body></html>
