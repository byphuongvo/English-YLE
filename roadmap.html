<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lộ trình học theo ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: một cột đọc rộng 820px, thanh tab buổi học dính trên cùng; hình minh họa luôn nằm trên nền sáng cố định để đọc được ở cả hai giao diện. */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --ink:#14213D; --muted:#56627F; --line:#D8DFEE;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF;
  --lvl:#C75A1B; --tile:#EAF1FF;
  --good:#17703F; --good-bg:#E1F3E8; --bad:#A8231B; --bad-bg:#FBE4E1; --note:#8A4F00; --note-bg:#FCEFD3;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#172036; --ink:#E7ECF8; --muted:#9AA6C3; --line:#2A3654;
    --accent:#7EA0FF; --accent-ink:#0E1526; --accent-soft:#22305A; --lvl:#F08A4B;
    --good:#6FDBA3; --good-bg:#16372A; --bad:#FF9B93; --bad-bg:#401B19; --note:#F2BC68; --note-bg:#3B2D12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#172036; --ink:#E7ECF8; --muted:#9AA6C3; --line:#2A3654;
  --accent:#7EA0FF; --accent-ink:#0E1526; --accent-soft:#22305A; --lvl:#F08A4B;
  --good:#6FDBA3; --good-bg:#16372A; --bad:#FF9B93; --bad-bg:#401B19; --note:#F2BC68; --note-bg:#3B2D12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:grid;gap:2px;min-width:0}
.brand b{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.brand span{font-size:.9rem;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:700}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.weeks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-block:4px 6px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;margin-top:6px}
.hero .kicker{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lvl)}
.hero ul{margin:0;padding-left:20px;display:grid;gap:4px}

.secbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:10px 10px}
.secs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.sec{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sec[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sec.tch{border-style:dashed}

.sechead{display:grid;gap:2px;padding-block:6px 4px}
.sechead .mins{color:var(--muted);font-size:.95rem}
.stack{display:grid;gap:16px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.blk>h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.textblk{padding:2px 4px}
.textblk ul{margin:6px 0 0;padding-left:22px;display:grid;gap:3px}

.tile{background:var(--tile);border-radius:14px;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;min-height:92px}
.tile .ico{width:92px;height:92px;flex:none}
.tile.sm .ico{width:74px;height:74px}
.scenebox{background:var(--tile);border-radius:14px;padding:8px;display:flex;justify-content:center}
.scene{width:100%;max-width:520px;height:auto;display:block}
.scenebox.sm .scene{max-width:170px}

.play{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.play svg{width:20px;height:20px}
.play.on{background:var(--accent);color:var(--accent-ink)}
.playlong{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700}
.playlong svg{width:22px;height:22px}

.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vcard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:grid;gap:4px;text-align:center;justify-items:center;min-width:0}
.vcard:hover{border-color:var(--accent)}
.vcard.on{border-color:var(--accent);background:var(--accent-soft)}
.vcard .w{font-family:var(--font-display);font-weight:600;font-size:1.2rem}
.vcard .vi{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}

.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pic{display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.pic .cap{display:flex;gap:8px;align-items:center;font-weight:700;overflow-wrap:anywhere;justify-content:center}
.pic .tile{width:100%}
.pic .scenebox{width:100%}
.pic .scene{max-width:130px}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-family:var(--font-display);font-weight:600;background:var(--bg)}
td .row{display:flex;gap:10px;align-items:center}
.key{font-family:var(--font-display);font-weight:600;color:var(--accent)}
.note{padding:12px 14px;border-radius:10px;background:var(--note-bg);color:var(--note);font-size:.97rem}
.tip{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.97rem}

.passage{display:grid;gap:8px;padding:14px 16px;border-left:5px solid var(--lvl);background:var(--bg);border-radius:0 12px 12px 0}
.q{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;min-width:0}
.q.ok{border-color:var(--good);background:var(--good-bg)}
.q.bad{border-color:var(--bad);background:var(--bad-bg)}
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qn{flex:none;min-width:2rem;height:2rem;border-radius:8px;background:var(--lvl);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;padding:0 6px}
:root[data-theme="dark"] .qn{color:#0E1526}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qn{color:#0E1526}}
.qt{font-weight:700;overflow-wrap:anywhere;min-width:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts.pic{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{position:relative;display:block;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ot{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;overflow-wrap:anywhere}
.opt .ot::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opts.pic .ot{flex-direction:column;justify-content:center;text-align:center}
.opts.pic .ot::before{order:2}
.opt input:checked + .ot{border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked + .ot::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 45%,transparent 50%)}
.opt input:focus-visible + .ot{outline:3px solid var(--accent);outline-offset:2px}
.optpic{display:block;width:100%}
.optpic .ico{width:64px;height:64px;display:block;margin:0 auto}
.optpic .scene{width:92px;max-width:100%;margin:0 auto}
.opt .optpic{background:var(--tile);border-radius:10px;padding:6px}
.gapq .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:1.1rem;font-weight:700}
.gap{font:inherit;font-weight:700;width:6.5rem;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.gap:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.q.ok .gap{border-color:var(--good)} .q.bad .gap{border-color:var(--bad)}
.bank{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:3px 12px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-weight:700}
.fb{font-size:.95rem;min-height:0}
.fb:empty{display:none}
.q.ok .fb{color:var(--good);font-weight:700}
.q.bad .fb{color:var(--bad)}
.tkey{font-size:.88rem;color:var(--note);background:var(--note-bg);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.92rem}
.score{font-weight:700}
.score.full{color:var(--good)}

.frames{margin:0;padding-left:22px;display:grid;gap:4px}
.prompt{font-family:var(--font-display);font-weight:600;font-size:1.25rem}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.shadow{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.shadow li{display:flex;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:1.1rem}
.shadow li b{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px}
.teacher{border:2px dashed var(--note);background:var(--note-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.96rem}
.teacher>b:first-child{color:var(--note)}
.script{display:grid;gap:8px}
.script .it{display:grid;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.92rem;min-width:0}
.script code{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.foot{padding:20px 4px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.blk{animation:rise .25s ease both}@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}


.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:6px;font-weight:700}
.login{max-width:480px;margin:40px auto 0}
.login input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.login input[type=text]:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pbar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.day{display:grid;gap:3px;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.day:hover:not(:disabled){border-color:var(--accent)}
.day .dn{font-family:var(--font-display);font-weight:600;color:var(--lvl)}
.day .dt{font-weight:700;overflow-wrap:anywhere}
.day .dm{font-size:.88rem;color:var(--muted)}
.day .ds{font-size:.85rem;font-weight:700;min-height:1.2em}
.day.done{border-color:var(--good);background:var(--good-bg)}
.day.done .ds{color:var(--good)}
.day.now{border-color:var(--accent);background:var(--accent-soft)}
.day.now .ds{color:var(--accent)}
.day:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid var(--muted);color:var(--muted);font-size:.8rem;font-weight:700}
.wk.lk{opacity:.85}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>

<script>
/* Dùng chung cho trang và cho công cụ tạo âm thanh. Không đụng tới DOM ở đây. */
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}
/* Một câu đọc: A("It is a cat.") hoặc A("It is a cat.","m",1) = giọng nam, đọc chậm */
function A(t,v,s){return {segs:[{v:v||'f',t:t}],s:s?1:0};}
/* Hội thoại nhiều giọng: D([["m","Hello"],["f","Hi"]]) */
function D(lines,s){return {segs:lines.map(function(l){return {v:l[0],t:l[1]};}),s:s?1:0};}
function aid(au){
  var key=JSON.stringify(au);
  var slug=au.segs[0].t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,26);
  return slug+'-'+hash(key);
}
function auText(au){return au.segs.map(function(s){return s.t;}).join(' ');}

ruler:function(c){c=KC(c||'yellow');return '<g transform="rotate(-25 50 50)"><rect x="8" y="38" width="84" height="26" rx="3" fill="'+c+'"/><path d="M18 38 v8 M28 38 v12 M38 38 v8 M48 38 v12 M58 38 v8 M68 38 v12 M78 38 v8" fill="none"/></g>';},

"use strict";
var STORE='yle-stage1-v1';
var ST={week:1,sec:'b1',teacher:false,view:'map',user:null};
var API_URL='';/* Dán địa chỉ Web App của Google Apps Script vào đây. Để trống = chế độ thử, chỉ lưu trên máy. */
var SESSION='yle-session';
var P={};
var saveTimer=null;
function userKey(){return ST.user?(ST.user.name+'|'+ST.user.code):'guest';}
function setSync(t){var el=document.getElementById('syncMsg');if(el){el.textContent=t;}}
function api(payload){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();});
}
function pushRemote(){
  if(!API_URL||!ST.user){return;}
  api({action:'lr_save',name:ST.user.name,code:ST.user.code,progress:P})
  .then(function(j){setSync(j.ok?'Đã lưu lên Google Sheet':'Lỗi lưu: '+(j.error||''));})
  .catch(function(){setSync('Chưa lưu được lên Google Sheet');});
}
function save(){
  try{localStorage.setItem(STORE+':'+userKey(),JSON.stringify(P));}catch(e){}
  if(API_URL&&ST.user){setSync('Đang lưu...');clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200);}
}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim();}
var VOICE_NAME={f:'Giọng nữ',m:'Giọng nam',f2:'Giọng nữ 2',m2:'Giọng nam 2'};

/* ---------- âm thanh ---------- */
var AUTXT={}, AUEL={}, curBtn=null, curAudio=null;
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.500a5 5 0 0 1 0 7M18.500 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function auBtn(au,label){
  var id=aid(au);AUTXT[id]=auText(au);
  if(label){return '<button type="button" class="playlong" data-au="'+id+'">'+SPK+esc(label)+'</button>';}
  return '<button type="button" class="play" data-au="'+id+'" aria-label="Nghe">'+SPK+'</button>';
}
function stopAll(){
  try{if(window.speechSynthesis){window.speechSynthesis.cancel();}}catch(e){}
  if(curAudio){try{curAudio.pause();}catch(e){}}
  if(curBtn){curBtn.classList.remove('on');curBtn=null;}
}
function speakFallback(text,btn){
  try{
    var syn=window.speechSynthesis;if(!syn||typeof SpeechSynthesisUtterance==='undefined'){return;}
    var u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.8;
    var vs=syn.getVoices();var gb=vs.filter(function(x){return /^en[-_]GB/i.test(x.lang);});
    var pref=/daniel|serena|kate|libby|sonia|oliver|martha|google uk/i;
    var v=gb.filter(function(x){return pref.test(x.name);})[0]||gb[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v){u.voice=v;u.lang=v.lang;}
    u.onend=function(){if(btn){btn.classList.remove('on');}};
    syn.speak(u);
  }catch(e){}
}
function playAu(btn){
  var id=btn.getAttribute('data-au');
  var same=(curBtn===btn);
  stopAll();
  if(same){return;}
  curBtn=btn;btn.classList.add('on');
  var a=AUEL[id];
  if(!a){a=new Audio('audio/'+id+'.mp3');a.preload='auto';AUEL[id]=a;a.addEventListener('ended',function(){if(curBtn===btn){btn.classList.remove('on');curBtn=null;}});}
  curAudio=a;
  try{a.currentTime=0;}catch(e){}
  var p=a.play();
  if(p&&p.catch){p.catch(function(){speakFallback(AUTXT[id],btn);});}
}

/* ---------- hình ---------- */
function pics(icon,c){
  if(Array.isArray(icon)){return icon.map(function(n){return iconSvg(n,c);}).join('');}
  return iconSvg(icon,c);
}
function one(x){
  if(x.scene){return '<span class="optpic">'+SCENE[x.scene]()+'</span>';}
  return '<span class="optpic">'+iconSvg(x.icon,x.c)+'</span>';
}
function optHtml(o){
  if(typeof o==='string'){return esc(o);}
  return one(o)+(o.l?'<span>'+esc(o.l)+'</span>':'');
}

/* ---------- khối nội dung ---------- */
function bid(b){return 'w'+ST.week+'.'+ST.sec+'.'+b;}
function actions(){return '<div class="actions"><button type="button" class="btn" data-act="check">Kiểm tra</button><button type="button" class="btn ghost" data-act="reset">Làm lại</button><span class="score" aria-live="polite"></span></div>';}
function tkeyMcq(q){
  var o=q.opts[q.ans];var t=typeof o==='string'?o:(o.l||('hình '+(q.ans+1)));
  var s='Đáp án: '+esc(t);
  if(q.au){s+=' · Lời nghe: "'+esc(auText(q.au))+'"';}
  return '<div class="tkey">'+s+'</div>';
}
function rText(b){return '<section class="textblk">'+b.html+'</section>';}
function rTeacher(b){return ST.teacher?'<aside class="teacher"><b>Dành cho giáo viên.</b> '+b.html+'</aside>':'';}
function rScene(b){return '<section class="blk"><div class="scenebox">'+SCENE[b.name]()+'</div>'+(b.cap?'<p class="muted">'+esc(b.cap)+'</p>':'')+'</section>';}
function rVocab(b){
  var h='<section class="blk"><h3>'+esc(b.title)+'</h3><p class="muted">'+esc(b.instr)+'</p><div class="vgrid">';
  b.items.forEach(function(it){var id=aid(it.au);AUTXT[id]=it.w;
    h+='<button type="button" class="vcard" data-au="'+id+'"><div class="tile sm">'+iconSvg(it.icon,it.c)+'</div><span class="w">'+esc(it.w)+'</span><span class="vi">'+esc(it.vi)+'</span></button>';});
  return h+'</div></section>';
}
function rRule(b){
  var h='<section class="blk"><h3>'+esc(b.title)+'</h3>';
  if(b.pics){h+='<div class="pics">';b.pics.forEach(function(p){h+='<div class="pic"><div class="tile">'+pics(p.icon)+'</div><div class="cap">'+esc(p.cap)+auBtn(p.au)+'</div></div>';});h+='</div>';}
  h+='<div class="tblwrap"><table><thead><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
  b.rows.forEach(function(r){h+='<tr><td><b>'+esc(r[0])+'</b></td><td class="key">'+esc(r[1])+'</td><td><div class="row">'+esc(r[2])+auBtn(r[3])+'</div></td></tr>';});
  h+='</tbody></table></div>';
  if(b.note){h+='<div class="note">'+b.note+'</div>';}
  return h+'</section>';
}
function rPics(b){
  var h='<section class="blk"><h3>'+esc(b.title)+'</h3><div class="pics">';
  b.items.forEach(function(p){h+='<div class="pic">'+(p.scene?'<div class="scenebox">'+SCENE[p.scene]()+'</div>':'<div class="tile">'+pics(p.icon)+'</div>')+'<div class="cap">'+esc(p.cap)+auBtn(p.au)+'</div></div>';});
  h+='</div>';if(b.note){h+='<div class="note">'+b.note+'</div>';}
  return h+'</section>';
}
function rMcq(b,id){
  var s=P[id]||{};var a=s.a||[];
  var h='<section class="blk" data-b="'+id+'" data-t="mcq"><h3>'+esc(b.title)+'</h3>';
  if(b.instr){h+='<p class="muted">'+esc(b.instr)+'</p>';}
  if(b.scene){h+='<div class="scenebox">'+SCENE[b.scene]()+'</div>';}
  if(b.passage){h+='<div class="passage">'+(b.passageAu?'<div>'+auBtn(b.passageAu,'Nghe cả đoạn')+'</div>':'')+'<p>'+esc(b.passage)+'</p></div>';}
  b.qs.forEach(function(q,i){
    var picOpts=q.opts.some(function(o){return typeof o!=='string';});
    h+='<div class="q" data-i="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span>'+(q.au?auBtn(q.au):'')+'<span class="qt">'+esc(q.q)+'</span></div>';
    if(q.icon){h+='<div class="tile">'+pics(q.icon,q.c)+'</div>';}
    h+='<div class="opts'+(picOpts?' pic':'')+'" role="radiogroup" aria-label="Câu '+(i+1)+'">';
    q.opts.forEach(function(o,k){var oid=id+'-'+i+'-'+k;
      h+='<label class="opt" for="'+oid+'"><input type="radio" id="'+oid+'" name="'+id+'-'+i+'" value="'+k+'"'+(a[i]===k?' checked':'')+'><span class="ot">'+optHtml(o)+'</span></label>';});
    h+='</div><div class="fb"></div>'+(ST.teacher?tkeyMcq(q):'')+'</div>';
  });
  return h+actions()+'</section>';
}
function rGap(b,id){
  var s=P[id]||{};var a=s.a||[];
  var h='<section class="blk" data-b="'+id+'" data-t="gap"><h3>'+esc(b.title)+'</h3><p class="muted">'+esc(b.instr)+'</p>';
  if(b.bank){h+='<div class="bank">'+b.bank.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>';}
  b.qs.forEach(function(q,i){
    h+='<div class="q gapq" data-i="'+i+'"><div class="qh"><span class="qn">'+(i+1)+'</span>'+(q.au?auBtn(q.au):'')+(q.icon?'<div class="tile sm">'+pics(q.icon)+'</div>':'')+'</div>';
    h+='<div class="line"><span>'+esc(q.pre)+'</span><input type="text" class="gap" id="'+id+'-'+i+'" value="'+esc(a[i]||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu '+(i+1)+'"><span>'+esc(q.post)+'</span></div>';
    h+='<div class="fb"></div>'+(ST.teacher?'<div class="tkey">Đáp án: '+esc(q.ans.join(' / '))+(q.au?' · Lời nghe: "'+esc(auText(q.au))+'"':'')+'</div>':'')+'</div>';
  });
  return h+actions()+'</section>';
}
function rSounds(b){
  var h='<section class="blk"><h3>'+esc(b.title)+'</h3><p class="muted">'+esc(b.instr)+'</p><div class="tblwrap"><table><thead><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
  b.pairs.forEach(function(p,i){h+='<tr><td><div class="row"><b>'+esc(p[0])+'</b>'+auBtn(b.aus[i][0])+'</div></td><td><div class="row"><b class="key">'+esc(p[1])+'</b>'+auBtn(b.aus[i][1])+'</div></td></tr>';});
  h+='</tbody></table></div>';if(b.tip){h+='<div class="tip">'+b.tip+'</div>';}
  return h+'</section>';
}
function rSpeak(b,id){
  var s=P[id]||{};var a=s.a||[];
  var h='<section class="blk" data-b="'+id+'" data-t="check"><h3>'+esc(b.title)+'</h3>';
  if(b.scene){h+='<div class="scenebox">'+SCENE[b.scene]()+'</div>';}
  h+='<p class="prompt">'+esc(b.prompt)+'</p><div><b>Khung câu gợi ý</b><ul class="frames">'+b.frames.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></div>';
  h+='<details><summary>'+esc(b.modelTitle)+'</summary><div style="display:grid;gap:8px">'+auBtn(b.model,'Nghe bài mẫu')+'<p>'+esc(auText(b.model))+'</p></div></details>';
  h+='<div><b>Em tự kiểm tra</b><div class="checks">'+b.check.map(function(c,i){return '<label><input type="checkbox" data-i="'+i+'"'+(a[i]?' checked':'')+'><span>'+esc(c)+'</span></label>';}).join('')+'</div></div>';
  return h+'</section>';
}
function rShadow(b){
  var h='<section class="blk"><h3>'+esc(b.title)+'</h3><ol class="shadow">';
  b.items.forEach(function(it,i){h+='<li>'+auBtn(it.au)+'<span>'+it.h+'</span></li>';});
  return h+'</ol></section>';
}
function rModel(b){
  return '<section class="blk"><details><summary>'+esc(b.title)+'</summary><div style="display:grid;gap:8px">'+auBtn(b.au,'Nghe bài mẫu')+'<p>'+esc(b.text)+'</p></div></details></section>';
}
function rCheck(b,id){
  var s=P[id]||{};var a=s.a||[];
  return '<section class="blk" data-b="'+id+'" data-t="check"><h3>'+esc(b.title)+'</h3><div class="checks">'+b.items.map(function(c,i){return '<label><input type="checkbox" data-i="'+i+'"'+(a[i]?' checked':'')+'><span>'+esc(c)+'</span></label>';}).join('')+'</div></section>';
}
function collectAudio(node,out){
  if(!node||typeof node!=='object'){return;}
  if(Array.isArray(node)){node.forEach(function(x){collectAudio(x,out);});return;}
  if(node.segs&&Array.isArray(node.segs)){var id=aid(node);if(!out.map[id]){out.map[id]=1;out.list.push({id:id,au:node});}return;}
  for(var k in node){collectAudio(node[k],out);}
}
function rScript(w){
  var out={map:{},list:[]};collectAudio(w.sections,out);
  var h='<section class="blk"><h3>Kịch bản thu âm</h3><p class="muted">Có '+out.list.length+' file âm thanh. Hiện đang dùng giọng Anh-Anh do máy tạo. Nếu thu giọng thật, hãy lưu đúng tên file bên dưới (dạng mp3) rồi gửi lại để thay vào trang.</p>';
  h+='<div class="actions"><button type="button" class="btn sm" data-act="copyscript">Sao chép kịch bản</button><span class="score" id="scriptMsg" aria-live="polite"></span></div><div class="script">';
  out.list.forEach(function(x,i){
    var lines=x.au.segs.map(function(s){return '<div><b>'+esc(VOICE_NAME[s.v]||s.v)+':</b> '+esc(s.t)+'</div>';}).join('');
    h+='<div class="it"><code>audio/'+esc(x.id)+'.mp3'+(x.au.s?' · đọc chậm':'')+'</code>'+lines+'</div>';
  });
  return h+'</div></section>';
}
function scriptText(w){
  var out={map:{},list:[]};collectAudio(w.sections,out);
  return out.list.map(function(x){return 'audio/'+x.id+'.mp3'+(x.au.s?' (đọc chậm)':'')+'\n'+x.au.segs.map(function(s){return (VOICE_NAME[s.v]||s.v)+': '+s.t;}).join('\n');}).join('\n\n');
}

/* ---------- lộ trình theo ngày ---------- */
var DAYMAP=[{s:'b1',k:'Bài học'},{s:'h1',k:'Bài tập'},{s:'h2',k:'Bài tập'},{s:'b2',k:'Bài học'},{s:'h3',k:'Bài tập'},{s:'h4',k:'Bài tập'}];
var CLASS_ROWS=null,CLASS_ERR='';
function weekById(id){return WEEKS.filter(function(w){return w.id===id;})[0];}
function weekObj(){return weekById(ST.week);}
function secById(w,s){return w.sections.filter(function(x){return x.id===s;})[0];}
function secObj(w){return secById(w,ST.sec);}
function doneMap(){if(!P._done){P._done={};}return P._done;}
function isDone(wid,s){return !!doneMap()['w'+wid+'.'+s];}
function unlockWeek(){return (ST.user&&ST.user.unlockWeek)||1;}
function isLocked(wid){return !ST.teacher&&wid>unlockWeek();}
function dayNo(wid,idx){return (wid-1)*6+idx+1;}
function dayIdx(s){for(var i=0;i<DAYMAP.length;i++){if(DAYMAP[i].s===s){return i;}}return -1;}
function flatDays(){var a=[];WEEKS.forEach(function(w){DAYMAP.forEach(function(m,j){a.push({w:w.id,s:m.s,idx:j});});});return a;}
function nextTodo(){
  var a=flatDays();
  for(var i=0;i<a.length;i++){if(!isLocked(a[i].w)&&!isDone(a[i].w,a[i].s)){return a[i];}}
  return null;
}
function counts(){var t=0,d=0;flatDays().forEach(function(x){if(isLocked(x.w)){return;}t++;if(isDone(x.w,x.s)){d++;}});return {t:t,d:d};}

function topbar(){
  var u=ST.user;
  var h='<header class="top"><div class="brand"><b>Lộ trình học tiếng Anh</b><span>'+esc(u.name)+(u.role==='teacher'?' · Giáo viên':'')+' · <span id="syncMsg"></span></span></div><div class="row2">';
  if(u.role==='teacher'){h+='<div class="seg" role="group" aria-label="Chế độ"><button type="button" data-mode="s" aria-pressed="'+(!ST.teacher)+'">Học sinh</button><button type="button" data-mode="t" aria-pressed="'+ST.teacher+'">Giáo viên</button></div>';}
  h+='<button type="button" class="btn ghost sm" data-act="logout">Đăng xuất</button></div></header>';
  if(!API_URL){h+='<div class="note">Chế độ thử: chưa kết nối Google Sheet, tiến độ chỉ lưu trên máy này.</div>';}
  return h;
}

function renderLogin(msg){
  stopAll();
  $('app').innerHTML='<div class="wrap"><section class="login blk"><h1>Chào mừng em quay lại</h1><p class="muted">Nhập tên và mã lớp cô đã gửi để xem lộ trình riêng của em.</p>'
   +'<form id="loginForm" class="stack"><label class="f">Tên của em<input type="text" id="lgName" autocomplete="username" required></label>'
   +'<label class="f">Mã lớp<input type="text" id="lgCode" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>'
   +'<div class="actions"><button class="btn" type="submit">Vào học</button><span class="score" id="lgMsg" role="status" aria-live="polite">'+esc(msg||'')+'</span></div></form>'
   +(API_URL?'':'<div class="note">Chế độ thử: nhập tên và mã bất kỳ. Nhập mã "gv" để vào bằng tài khoản giáo viên.</div>')+'</section></div>';
}

function renderMap(){
  stopAll();
  var c=counts(),pct=c.t?Math.round(c.d/c.t*100):0,nt=nextTodo();
  var h='<div class="wrap">'+topbar();
  h+='<section class="hero"><div class="kicker">Lộ trình của '+esc(ST.user.name)+'</div><h1>'+(nt?'Hôm nay học gì?':'Em đã xong hết các ngày học đã mở')+'</h1>';
  h+='<div class="pbar" role="img" aria-label="Đã xong '+c.d+' trên '+c.t+' ngày"><i style="width:'+pct+'%"></i></div><p class="muted">Đã xong '+c.d+'/'+c.t+' ngày học đã mở.</p>';
  if(nt){var sc=secById(weekById(nt.w),nt.s);h+='<div class="actions"><button type="button" class="btn" data-open="w'+nt.w+'-'+nt.s+'">Học Ngày '+dayNo(nt.w,nt.idx)+': '+esc(sc.title)+'</button></div>';}
  h+='</section>';
  if(ST.teacher){h+='<div class="actions"><button type="button" class="btn ghost sm" data-act="class">Xem cả lớp</button></div>';}
  h+='<main class="stack">';
  WEEKS.forEach(function(w){
    var lk=isLocked(w.id);
    h+='<section class="blk wk'+(lk?' lk':'')+'"><h3>'+esc(w.title)+': '+esc(w.topic)+(lk?' <span class="pill">Chưa mở</span>':'')+'</h3><p class="muted">'+esc(w.sub)+'</p><div class="days">';
    DAYMAP.forEach(function(m,j){
      var sc=secById(w,m.s),dn=isDone(w.id,m.s),isNt=nt&&nt.w===w.id&&nt.s===m.s;
      h+='<button type="button" class="day'+(dn?' done':'')+(isNt?' now':'')+'" data-open="w'+w.id+'-'+m.s+'"'+(lk?' disabled':'')+'><span class="dn">Ngày '+dayNo(w.id,j)+'</span><span class="dt">'+esc(sc.title)+'</span><span class="dm">'+m.k+' · '+sc.mins+' phút</span><span class="ds">'+(dn?'Đã xong':(isNt?'Hôm nay':(lk?'Chưa mở':'')))+'</span></button>';
    });
    h+='</div>';
    if(ST.teacher){h+='<div class="actions"><button type="button" class="btn ghost sm" data-open="w'+w.id+'-script">Kịch bản thu âm</button></div>';}
    h+='</section>';
  });
  h+='</main><p class="foot">Tiến độ được lưu theo tên của em.</p></div>';
  $('app').innerHTML=h;
}

function renderDay(){
  var w=weekObj();
  if(!w){ST.view='map';render();return;}
  var h='<div class="wrap">'+topbar();
  if(ST.sec==='script'){
    if(!ST.teacher){ST.view='map';render();return;}
    h+='<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>'+esc(w.title)+' · Kịch bản thu âm</b></div></div><main class="stack">'+rScript(w)+'</main></div>';
    stopAll();$('app').innerHTML=h;return;
  }
  var sec=secObj(w),idx=dayIdx(ST.sec);
  if(!sec){ST.view='map';render();return;}
  h+='<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>Ngày '+dayNo(w.id,idx)+' · '+esc(w.title)+'</b></div></div>';
  h+='<main class="stack"><div class="sechead"><h2>'+esc(sec.title)+'</h2><span class="mins">'+DAYMAP[idx].k+' · khoảng '+sec.mins+' phút</span></div>';
  sec.blocks.forEach(function(b,i){var id=bid(i);
    switch(b.t){
      case 'text':h+=rText(b);break;case 'teacher':h+=rTeacher(b);break;case 'scene':h+=rScene(b);break;
      case 'vocab':h+=rVocab(b);break;case 'rule':h+=rRule(b);break;case 'pics':h+=rPics(b);break;
      case 'mcq':h+=rMcq(b,id);break;case 'gap':h+=rGap(b,id);break;case 'sounds':h+=rSounds(b);break;
      case 'speak':h+=rSpeak(b,id);break;case 'shadow':h+=rShadow(b);break;case 'model':h+=rModel(b);break;case 'check':h+=rCheck(b,id);break;
    }
  });
  var dn=isDone(w.id,ST.sec);
  h+='<section class="blk"><div class="actions"><button type="button" class="btn" data-act="done" id="doneBtn">'+(dn?'Bỏ đánh dấu đã xong':'Hoàn thành ngày học')+'</button><span class="score full" id="doneMsg" aria-live="polite">'+(dn?'Em đã hoàn thành ngày này.':'')+'</span></div></section>';
  var fl=flatDays(),pos=-1;
  fl.forEach(function(x,i){if(x.w===w.id&&x.s===ST.sec){pos=i;}});
  var pv=pos>0?fl[pos-1]:null,nx=pos<fl.length-1?fl[pos+1]:null;
  if(nx&&isLocked(nx.w)){nx=null;}
  h+='<div class="nav">'+(pv?'<button type="button" class="btn ghost sm" data-open="w'+pv.w+'-'+pv.s+'">← Ngày '+dayNo(pv.w,pv.idx)+'</button>':'<span></span>')+(nx?'<button type="button" class="btn ghost sm" data-open="w'+nx.w+'-'+nx.s+'">Ngày '+dayNo(nx.w,nx.idx)+' →</button>':'<span></span>')+'</div>';
  h+='</main></div>';
  stopAll();
  $('app').innerHTML=h;
  document.querySelectorAll('[data-t="mcq"],[data-t="gap"]').forEach(function(el){if((P[el.getAttribute('data-b')]||{}).c){grade(el,false);}});
}

function renderClass(){
  var h='<div class="wrap">'+topbar()+'<div class="secbar"><div class="actions"><button type="button" class="btn ghost sm" data-act="back">← Lộ trình</button><b>Cả lớp</b><button type="button" class="btn sm" data-act="refreshclass">Tải lại</button></div></div><main class="stack"><section class="blk">';
  if(CLASS_ERR){h+='<div class="note">'+esc(CLASS_ERR)+'</div>';}
  else if(CLASS_ROWS===null){h+='<p class="muted">Đang tải danh sách...</p>';}
  else if(!CLASS_ROWS.length){h+='<p class="muted">'+(API_URL?'Chưa có học sinh nào trong Google Sheet.':'Chế độ thử không có danh sách cả lớp. Hãy kết nối Google Sheet.')+'</p>';}
  else{
    h+='<div class="tblwrap"><table><thead><tr><th>Họ tên</th><th>Tuần đã mở</th><th>Ngày đã xong</th><th>Cập nhật</th></tr></thead><tbody>';
    CLASS_ROWS.forEach(function(r){h+='<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.unlockWeek)+'</td><td>'+esc(r.doneCount)+'</td><td>'+esc(r.updatedAt||'')+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  h+='</section></main></div>';
  $('app').innerHTML=h;
}
function loadClass(){
  CLASS_ROWS=null;CLASS_ERR='';render();
  if(!API_URL){CLASS_ROWS=[];render();return;}
  api({action:'lr_list',name:ST.user.name,code:ST.user.code}).then(function(j){
    if(j.ok){CLASS_ROWS=j.students;}else{CLASS_ERR=j.error||'Không tải được danh sách.';}
    render();
  }).catch(function(){CLASS_ERR='Chưa kết nối được Google Sheet.';render();});
}

function render(){
  if(!ST.user){renderLogin();return;}
  if(ST.view==='day'){renderDay();}
  else if(ST.view==='class'){renderClass();}
  else{renderMap();}
}

/* ---------- đăng nhập ---------- */
function applyStudent(s,code){
  ST.user={name:s.name,code:code,role:s.role||'student',unlockWeek:parseInt(s.unlockWeek,10)||1};
  ST.teacher=(ST.user.role==='teacher');
  var local={};
  try{local=JSON.parse(localStorage.getItem(STORE+':'+userKey())||'{}')||{};}catch(e){local={};}
  P=(s.progress&&typeof s.progress==='object'&&Object.keys(s.progress).length)?s.progress:local;
  try{localStorage.setItem(SESSION,JSON.stringify({name:s.name,code:code}));}catch(e){}
}
function setMsg(t){var m=$('lgMsg');if(m){m.textContent=t;}}
function afterLogin(){ST.view='map';readHash();render();window.scrollTo(0,0);}
function doLogin(name,code,silent){
  name=String(name||'').trim();code=String(code||'').trim();
  if(!name||!code){if(silent){renderLogin();}return;}
  if(!API_URL){applyStudent({name:name,role:code.toLowerCase()==='gv'?'teacher':'student',unlockWeek:2},code);afterLogin();return;}
  setMsg('Đang kiểm tra...');
  api({action:'lr_login',name:name,code:code}).then(function(j){
    if(j.ok){applyStudent(j.student,code);afterLogin();}
    else{if(silent){try{localStorage.removeItem(SESSION);}catch(e){}renderLogin();}else{setMsg(j.error||'Tên hoặc mã lớp chưa đúng.');}}
  }).catch(function(){if(silent){renderLogin('Chưa kết nối được. Hãy thử lại.');}else{setMsg('Chưa kết nối được. Hãy thử lại.');}});
}
function logout(){
  try{localStorage.removeItem(SESSION);}catch(e){}
  ST.user=null;ST.teacher=false;ST.view='map';P={};
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  render();
}

/* ---------- chấm ---------- */
function findBlock(id){
  var p=id.split('.');var w=weekById(parseInt(p[0].slice(1),10));
  var s=secById(w,p[1]);return s.blocks[parseInt(p[2],10)];
}
function grade(el,store){
  var id=el.getAttribute('data-b');var b=findBlock(id);var type=el.getAttribute('data-t');
  var answers=[],ok=0;
  b.qs.forEach(function(q,i){
    var qel=el.querySelector('.q[data-i="'+i+'"]');var fb=qel.querySelector('.fb');var good=false,val=null,msg='';
    if(type==='mcq'){
      var r=qel.querySelector('input[type=radio]:checked');val=r?parseInt(r.value,10):null;good=(val===q.ans);
      var o=q.opts[q.ans];var t=typeof o==='string'?o:(o.l||('hình '+(q.ans+1)));
      msg=val===null?'Em chưa chọn. Đáp án: '+t:(good?'Đúng rồi!':'Chưa đúng. Đáp án: '+t);
      if(!good&&q.why){msg+='. '+q.why;}
    }else{
      var inp=qel.querySelector('input.gap');val=inp.value;var n=norm(val);
      good=q.ans.some(function(x){return norm(x)===n;});
      msg=!n?'Em chưa điền. Đáp án: '+q.ans[0]:(good?'Đúng rồi!':'Chưa đúng. Đáp án: '+q.ans[0]);
    }
    answers.push(val);if(good){ok++;}
    qel.classList.toggle('ok',good);qel.classList.toggle('bad',!good);fb.textContent=msg;
  });
  var sc=el.querySelector('.score');sc.textContent=ok+'/'+b.qs.length+(ok===b.qs.length?' · Tuyệt vời!':'');sc.classList.toggle('full',ok===b.qs.length);
  if(store){P[id]={a:answers,c:1,s:ok,n:b.qs.length};save();}
}
function resetBlock(el){
  var id=el.getAttribute('data-b');
  el.querySelectorAll('.q').forEach(function(q){q.classList.remove('ok','bad');q.querySelector('.fb').textContent='';});
  el.querySelectorAll('input[type=radio]').forEach(function(r){r.checked=false;});
  el.querySelectorAll('input.gap').forEach(function(r){r.value='';});
  var sc=el.querySelector('.score');sc.textContent='';sc.classList.remove('full');
  delete P[id];save();
}

/* ---------- đường dẫn ---------- */
function setHash(){
  try{
    if(ST.view==='day'){history.replaceState(null,'','#w'+ST.week+'-'+ST.sec);}
    else{history.replaceState(null,'',location.pathname+location.search);}
  }catch(e){}
}
function readHash(){
  var m=/^#w(\d+)-([a-z0-9]+)$/.exec(location.hash||'');
  if(!m||!ST.user){return;}
  var wid=parseInt(m[1],10),w=weekById(wid);
  if(!w||isLocked(wid)){return;}
  if(m[2]==='script'){if(!ST.teacher){return;}}
  else if(!secById(w,m[2])){return;}
  ST.week=wid;ST.sec=m[2];ST.view='day';
}

document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='loginForm'){e.preventDefault();doLogin($('lgName').value,$('lgCode').value,false);}
});
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest){return;}
  var au=t.closest('[data-au]');if(au){playAu(au);return;}
  var op=t.closest('[data-open]');if(op){
    var m=/^w(\d+)-([a-z0-9]+)$/.exec(op.getAttribute('data-open'));
    if(m&&!isLocked(parseInt(m[1],10))){ST.week=parseInt(m[1],10);ST.sec=m[2];ST.view='day';setHash();render();window.scrollTo(0,0);}
    return;
  }
  var md=t.closest('[data-mode]');if(md){ST.teacher=(md.getAttribute('data-mode')==='t');render();return;}
  var ac=t.closest('[data-act]');if(!ac){return;}
  var act=ac.getAttribute('data-act');var blk=ac.closest('[data-b]');
  if(act==='check'&&blk){grade(blk,true);}
  else if(act==='reset'&&blk){resetBlock(blk);}
  else if(act==='back'){ST.view='map';setHash();render();window.scrollTo(0,0);}
  else if(act==='logout'){logout();}
  else if(act==='class'){ST.view='class';loadClass();window.scrollTo(0,0);}
  else if(act==='refreshclass'){loadClass();}
  else if(act==='done'){
    var key='w'+ST.week+'.'+ST.sec,dm=doneMap(),btn=$('doneBtn'),msg=$('doneMsg');
    if(dm[key]){delete dm[key];btn.textContent='Hoàn thành ngày học';msg.textContent='';}
    else{dm[key]=Date.now();btn.textContent='Bỏ đánh dấu đã xong';msg.textContent='Giỏi lắm! Em đã hoàn thành ngày này.';}
    save();
  }
  else if(act==='copyscript'){
    var txt=scriptText(weekObj());var sm=$('scriptMsg');
    try{navigator.clipboard.writeText(txt).then(function(){sm.textContent='Đã sao chép';},function(){sm.textContent='Không sao chép được. Hãy chọn và sao chép thủ công.';});}
    catch(err){sm.textContent='Không sao chép được. Hãy chọn và sao chép thủ công.';}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.type==='checkbox'){
    var blk=t.closest('[data-b]');if(!blk){return;}
    var id=blk.getAttribute('data-b');var arr=[];
    blk.querySelectorAll('input[type=checkbox]').forEach(function(c){arr.push(c.checked?1:0);});
    P[id]={a:arr};save();
  }
});
window.addEventListener('hashchange',function(){if(ST.user){ST.view='map';readHash();render();}});

/* ---------- khởi động ---------- */
(function(){
  var s=null;
  try{s=JSON.parse(localStorage.getItem(SESSION)||'null');}catch(e){s=null;}
  if(s&&s.name&&s.code){
    if(API_URL){$('app').innerHTML='<div class="wrap"><p class="muted" style="padding:40px 4px">Đang vào lớp...</p></div>';}
    doLogin(s.name,s.code,true);
  }else{renderLogin();}
})();
})();

</script>
