function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}

/* Hội thoại nhiều giọng: D([["m","Hello"],["f","Hi"]]) */
function D(lines,s){return {segs:lines.map(function(l){return {v:l[0],t:l[1]};}),s:s?1:0};}
function aid(au){
  var key=JSON.stringify(au);
  var slug=au.segs[0].t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,26);
  return slug+'-'+hash(key);
}
function auText(au){return au.segs.map(function(s){return s.t;}).join(' ');}

/* ---------- âm thanh (mp3 nếu có, không thì giọng đọc của trình duyệt) ---------- */
var AUTXT={},AUEL={},curBtn=null,curAudio=null;
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.500a5 5 0 0 1 0 7M18.500 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function auBtn(au,label){
  var id=aid(au);AUTXT[id]=auText(au);
  if(label){return '<button type="button" class="playlong" data-au="'+id+'">'+SPK+esc(label)+'</button>';}
  return '<button type="button" class="play" data-au="'+id+'" aria-label="Nghe">'+SPK+'</button>';
}
function stopAll(){
  try{if(window.speechSynthesis){window.speechSynthesis.cancel();}}catch(e){}
  if(curAudio){try{curAudio.pause();}catch(e){}}
  if(curBtn){curBtn.classList.remove('on');curBtn=null;}
}
function speakFallback(text,btn){
  try{
    var syn=window.speechSynthesis;if(!syn||typeof SpeechSynthesisUtterance==='undefined'){return;}
    var u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.8;
    var vs=syn.getVoices();var gb=vs.filter(function(x){return /^en[-_]GB/i.test(x.lang);});
    var pref=/daniel|serena|kate|libby|sonia|oliver|martha|google uk/i;
    var v=gb.filter(function(x){return pref.test(x.name);})[0]||gb[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v){u.voice=v;u.lang=v.lang;}
    u.onend=function(){if(btn){btn.classList.remove('on');}};
    syn.speak(u);
  }catch(e){}
}
function playAu(btn){
  var id=btn.getAttribute('data-au');
  var same=(curBtn===btn);
  stopAll();
  if(same){return;}
  curBtn=btn;btn.classList.add('on');
  var a=AUEL[id];
  if(!a){a=new Audio('audio/'+id+'.mp3');a.preload='auto';AUEL[id]=a;a.addEventListener('ended',function(){if(curBtn===btn){btn.classList.remove('on');curBtn=null;}});}
  curAudio=a;
  try{a.currentTime=0;}catch(e){}
  var p=a.play();
  if(p&&p.catch){p.catch(function(){speakFallback(AUTXT[id],btn);});}
}

    {t:"There is a book in the bag.",vi:"Có một quyển sách trong cặp."},{t:"There are two pencils in the bag too.",vi:"Trong cặp cũng có hai cây bút chì."},
    {t:"The ruler is under the book.",vi:"Cây thước ở dưới quyển sách."},{t:"Mia is happy with her bag.",vi:"Mia rất vui với chiếc cặp của mình."}]},
  {id:'room',title:'My room',sents:[
    {t:"This is my room.",vi:"Đây là phòng của em."},{t:"There is a bed in my room.",vi:"Trong phòng em có một cái giường."},
    {t:"There are two chairs and a table.",vi:"Có hai cái ghế và một cái bàn."},{t:"My cat is under the table.",vi:"Con mèo của em ở dưới cái bàn."},
    {t:"The lamp is on the table.",vi:"Cái đèn ở trên bàn."},{t:"I am happy in my room.",vi:"Em rất vui trong phòng của mình."}]}
];
STORIES.forEach(function(s){s.full=s.sents.map(function(x){return x.t;}).join(' ');});
var PICS=[
  {id:'park',title:'Công viên',scene:'park',frames:['This is a ___.','The ___ is ___ (red, blue, big, small).','The girl / The boy is ___.'],sents:[
    "This is a park.","The girl is happy.","The bag is red.","The dog is small.","The ball is big and blue.","The boy is happy too."]},
  {id:'room',title:'Căn phòng',scene:'room',frames:['There is a ___ in the room.','There are two ___.','The ___ is on / under / in the ___.'],sents:[
    "This is a room.","There is a bed in the room.","There are two chairs.","There is a lamp on the table.","There are two books on the table.",
    "The cat is under the table.","The bird is on the chair.","The box is under the bed."]}
];

/* ---------- chấm phát âm ---------- */
var NUM={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen','16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen','20':'twenty'};
function words(s){
  s=String(s||'').toLowerCase().replace(/[‘’]/g,"'");
  s=s.replace(/'s\b/g,'').replace(/\b\d+\b/g,function(m){return NUM[m]||m;});
  return s.replace(/[^a-z' ]+/g,' ').split(/\s+/).filter(Boolean);
}
function align(T,Sp){
  var n=T.length,m=Sp.length,d=[],i,j;
  for(i=0;i<=n;i++){d.push([]);for(j=0;j<=m;j++){d[i].push(0);}}
  for(i=1;i<=n;i++){for(j=1;j<=m;j++){d[i][j]=(T[i-1]===Sp[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);}}
  var hit=T.map(function(){return false;});
  i=n;j=m;
  while(i>0&&j>0){
    if(T[i-1]===Sp[j-1]){hit[i-1]=true;i--;j--;}
    else if(d[i-1][j]>=d[i][j-1]){i--;}
    else{j--;}
  }
  return {hit:hit,hits:d[n][m],extra:Math.max(m-d[n][m],0)};
}
function scoreOne(T,Sp){
  var a=align(T,Sp);
  var sc=T.length?Math.round(100*a.hits/T.length):0;
  a.score=Math.max(0,sc-Math.min(10,a.extra*3));
  return a;
}
function resultHtml(target,alts){
  var T=words(target),best=null,bt='',bc=0;
  alts.forEach(function(a){
    var r=scoreOne(T,words(a.t)),c=Number(a.c)||0;
    if(!best||r.score>best.score||(r.score===best.score&&c>bc)){best=r;bt=a.t;bc=c;}
  });
  var sc=best.score;
  var spans=T.map(function(w,i){return '<span class="w '+(best.hit[i]?'ok':'no')+'">'+esc(w)+'</span>';}).join(' ');
  var label=sc>=90?'Rất tốt!':(sc>=70?'Khá tốt, luyện thêm vài từ.':(sc>=40?'Cần luyện thêm, nghe mẫu rồi thử lại.':'Thử lại chậm và rõ hơn nhé.'));
  var spoken=words(bt),miss=[],tips=[];
  T.forEach(function(w,i){if(!best.hit[i]&&miss.indexOf(w)<0){miss.push(w);}});
  miss.forEach(function(w){
    if(w.length>3&&/s$/.test(w)){
      var stem=w.replace(/es$/,'');if(stem===w){stem=w.replace(/s$/,'');}
      if(spoken.indexOf(stem)>=0||spoken.indexOf(w.replace(/s$/,''))>=0){tips.push('Em đã bỏ âm cuối -s ở "'+esc(w)+'".');}
    }
  });
  if(miss.length){tips.push('Từ chưa rõ: '+miss.map(esc).join(', ')+'.');}
  var html='<div class="sc '+(sc>=70?'good':(sc>=40?'mid':'low'))+'"><b>'+sc+'/100</b> · '+label+'</div><div class="ws">'+spans+'</div><div class="m heard">Máy nghe được: "'+esc(bt||'')+'"</div>';
  if(tips.length){html+='<div class="tips">'+tips.join(' ')+'</div>';}
  return {html:html,score:sc};
}
window.__review={words:words,align:align,scoreOne:scoreOne};

/* ---------- ghi âm ---------- */
var REG=[],RES={},REC=null;
var MIC='<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M18 11a6 6 0 0 1-12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function recBlock(target,bkey,label){
  var i=REG.length;REG.push({t:target,k:bkey});
  var b=S.best[bkey];label=label||'Ghi âm';
  return '<div class="rec"><div class="recrow"><button type="button" class="btn rec-btn" data-rec="'+i+'" data-label="'+esc(label)+'">'+MIC+'<span>'+esc(label)+'</span></button><span class="bestb">'+(b!=null?'Cao nhất: '+b:'')+'</span></div><div class="res" data-res="'+i+'" aria-live="polite">'+(RES[bkey]||'')+'</div></div>';
}
function setRecBtn(btn,on){
  btn.classList.toggle('on',on);
  btn.querySelector('span').textContent=on?'Đang nghe... bấm để dừng':btn.getAttribute('data-label');
}
function stopRec(){if(REC){try{REC.r.stop();}catch(e){}}}
var ERRMSG={
  'not-allowed':'Em cần cho phép trình duyệt dùng micro (bấm vào biểu tượng ổ khoá cạnh địa chỉ trang rồi chọn cho phép).',
  'service-not-allowed':'Em cần cho phép trình duyệt dùng micro (bấm vào biểu tượng ổ khoá cạnh địa chỉ trang rồi chọn cho phép).',
  'no-speech':'Cô chưa nghe thấy giọng em. Hãy nói to hơn và thử lại.',
  'audio-capture':'Không tìm thấy micro trên thiết bị này.',
  'network':'Cần có mạng để chấm phát âm. Hãy kiểm tra kết nối rồi thử lại.',
  'language-not-supported':'Trình duyệt chưa hỗ trợ nhận giọng tiếng Anh.'
};
function startRec(i,btn){
  var item=REG[i],res=document.querySelector('[data-res="'+i+'"]');
  if(!item||!res){return;}
  if(REC&&REC.i===i){stopRec();return;}
  stopRec();stopAll();
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){res.innerHTML='<div class="tips">Trình duyệt này chưa hỗ trợ chấm tự động. Hãy mở bằng Chrome (máy tính, Android) hoặc Safari mới nhất (iPhone, iPad).</div>';return;}
  var r=new SR(),got=false;
  r.lang='en-GB';r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  REC={r:r,i:i};
  setRecBtn(btn,true);
  res.innerHTML='<div class="m">Đang nghe... Em hãy đọc to và rõ.</div>';
  r.onresult=function(ev){
    got=true;
    var alts=[],list=ev.results[0];
    for(var j=0;j<list.length;j++){alts.push({t:list[j].transcript,c:list[j].confidence});}
    var out=resultHtml(item.t,alts);
    RES[item.k]=out.html;res.innerHTML=out.html;
    if(S.best[item.k]==null||out.score>S.best[item.k]){
      S.best[item.k]=out.score;save();
      var b=btn.parentNode.querySelector('.bestb');if(b){b.textContent='Cao nhất: '+out.score;}
    }
  };
  r.onerror=function(ev){
    got=true;
    var m=ERRMSG[ev&&ev.error];
    res.innerHTML=(ev&&ev.error==='aborted')?'':'<div class="tips">'+(m||'Chưa ghi âm được. Hãy thử lại.')+'</div>';
  };
  r.onend=function(){
    setRecBtn(btn,false);
    if(REC&&REC.r===r){REC=null;}
    if(!got){res.innerHTML='<div class="tips">Cô chưa nghe thấy giọng em. Hãy thử lại.</div>';}
  };
  try{r.start();}catch(e){setRecBtn(btn,false);REC=null;res.innerHTML='<div class="tips">Chưa ghi âm được. Hãy thử lại.</div>';}
}

/* ---------- giao diện ---------- */
var TAB='flash',FS={deck:'v',only:false,idx:0,flip:false,perm:null},SEL={story:0,pic:0};
var TABS=[['flash','Flashcard'],['story','Truyện ngắn'],['pic','Tả tranh']];
function kOf(deck,it){return deck+':'+it.id;}
function items(){return FS.deck==='v'?VOCAB:GRAM;}
function curList(){
  var its=items(),order=its.map(function(x,i){return i;});
  if(FS.perm&&FS.perm.deck===FS.deck){order=FS.perm.o;}
  return order.filter(function(i){return !(FS.only&&S.known[kOf(FS.deck,its[i])]);});
}
function shuffle(){
  var o=items().map(function(x,i){return i;});
  for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=o[i];o[i]=o[j];o[j]=t;}
  FS.perm={deck:FS.deck,o:o};FS.idx=0;FS.flip=false;
}
function pk(attr,val,on,label){return '<button type="button" class="pk'+(on?' on':'')+'" data-'+attr+'="'+val+'" aria-pressed="'+on+'">'+esc(label)+'</button>';}

function rFlash(){
  var its=items(),L=curList(),known=0;
  its.forEach(function(it){if(S.known[kOf(FS.deck,it)]){known++;}});
  var h='<section class="blk"><div class="ctl">'+pk('deck','v',FS.deck==='v','Từ vựng (24)')+pk('deck','g',FS.deck==='g','Ngữ pháp (12)')+'<span class="sp"></span>'
    +pk('only','0',!FS.only,'Tất cả')+pk('only','1',FS.only,'Chưa nhớ')+'<button type="button" class="btn ghost sm" data-act="shuffle">Xáo thẻ</button></div>';
  if(!L.length){
    return h+'<p class="big">Em đã nhớ hết thẻ trong bộ này!</p><div class="actions"><button type="button" class="btn" data-act="resetk">Học lại từ đầu</button></div></section>';
  }
  var idx=FS.idx%L.length;FS.idx=idx;
  var it=its[L[idx]];
  h+='<div class="fhead">Thẻ '+(idx+1)+'/'+L.length+' · Đã nhớ '+known+'/'+its.length+'</div>';
  if(!FS.flip){
    var front=FS.deck==='v'
      ?'<div class="tile bigtile">'+iconSvg(it.icon,it.c)+'</div><div class="prompt">Đây là gì?</div>'
      :'<div class="prompt gq">'+esc(it.pre)+'<span class="blank">____</span>'+esc(it.post)+'</div><div class="bank">'+it.opts.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>';
    h+='<div class="face front" role="button" tabindex="0" data-act="flip" aria-label="Lật thẻ">'+front+'<span class="hint">Chạm để lật thẻ</span></div>';
  }else{
    var back;
    if(FS.deck==='v'){
      back='<div class="tile sm">'+iconSvg(it.icon,it.c)+'</div><div class="bigw">'+esc(it.w)+' '+auBtn(A(it.w))+'</div><div class="muted">'+esc(it.vi)+'</div>'
        +'<div class="exs">'+esc(it.ex)+' '+auBtn(A(it.ex))+'</div>'+recBlock(it.w,'v:'+it.id,'Đọc từ')+recBlock(it.ex,'v:'+it.id+':ex','Đọc câu ví dụ');
    }else{
      back='<div class="prompt gq">'+esc(it.pre)+'<b class="ans">'+esc(it.ans)+'</b>'+esc(it.post)+' '+auBtn(A(it.full))+'</div><div class="tip">'+it.note+'</div>'+recBlock(it.full,'g:'+it.id,'Đọc cả câu');
    }
    h+='<div class="face back">'+back+'</div>';
  }
  h+='<div class="nav2"><button type="button" class="btn ghost sm" data-act="prev">← Trước</button>';
  if(FS.flip){h+='<button type="button" class="btn ghost sm" data-act="flip">Lật lại</button>';}
  h+='<button type="button" class="btn ghost sm" data-act="next">Sau →</button></div>';
  if(FS.flip){h+='<div class="marks"><button type="button" class="btn ghost" data-mark="0">Chưa nhớ</button><button type="button" class="btn" data-mark="1">Đã nhớ</button></div>';}
  return h+'</section>';
}

function sentRows(list,pre){
  return '<div class="sents">'+list.map(function(s,i){
    var t=typeof s==='string'?s:s.t;
    return '<div class="srow"><div class="stxt">'+auBtn(A(t))+'<span>'+esc(t)+'</span></div>'+recBlock(t,pre+':'+i,'Ghi âm câu này')+'</div>';
  }).join('')+'</div>';
}
function rStory(){
  var st=STORIES[SEL.story];
  var h='<section class="blk"><div class="ctl">'+STORIES.map(function(s,i){return pk('story',i,i===SEL.story,s.title);}).join('')+'</div>';
  h+='<h2>'+esc(st.title)+'</h2><div>'+auBtn(A(st.full),'Nghe cả truyện')+'</div>';
  h+='<p class="muted">Bấm loa để nghe từng câu, rồi bấm Ghi âm và đọc lại thật to.</p>'+sentRows(st.sents,'s:'+st.id);
  h+='<details><summary>Xem nghĩa tiếng Việt</summary><ol class="vi">'+st.sents.map(function(x){return '<li>'+esc(x.vi)+'</li>';}).join('')+'</ol></details></section>';
  return h;
}
function rPic(){
  var p=PICS[SEL.pic];
  var h='<section class="blk"><div class="ctl">'+PICS.map(function(x,i){return pk('pic',i,i===SEL.pic,x.title);}).join('')+'</div>';
  h+='<div class="scenebox">'+SCENE[p.scene]()+'</div>';
  h+='<div><b>Khung câu gợi ý</b><ul class="frames">'+p.frames.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></div>';
  h+='<div>'+auBtn(A(p.sents.join(' ')),'Nghe cả bài mẫu')+'</div>'+sentRows(p.sents,'p:'+p.id)+'</section>';
  return h;
}
function allAudio(){
  var out=[],seen={};
  function add(au){var id=aid(au);if(!seen[id]){seen[id]=1;out.push({id:id,t:auText(au)});}}
  VOCAB.forEach(function(v){add(A(v.w));add(A(v.ex));});
  GRAM.forEach(function(g){add(A(g.full));});
  STORIES.forEach(function(s){add(A(s.full));s.sents.forEach(function(x){add(A(x.t));});});
  PICS.forEach(function(p){add(A(p.sents.join(' ')));p.sents.forEach(function(x){add(A(x));});});
  return out;
}
function rScriptList(){
  var l=allAudio();
  return '<section class="blk"><h3>Danh sách file âm thanh cần thu ('+l.length+')</h3><p class="muted">Lưu mỗi file mp3 vào thư mục audio/ với đúng tên. Chưa có file thì trang tự dùng giọng đọc của trình duyệt.</p><div class="script">'
    +l.map(function(x){return '<div class="it"><code>audio/'+esc(x.id)+'.mp3</code><div>'+esc(x.t)+'</div></div>';}).join('')+'</div></section>';
}
function render(){
  stopRec();stopAll();REG=[];
  var h='<div class="wrap"><header class="top"><div class="brand"><b>Ôn tập tiếng Anh</b><span>Flashcard, truyện ngắn, tả tranh</span></div><div class="row2"><a class="btn ghost sm lnk" href="roadmap.html">← Lộ trình</a></div></header>';
  h+='<div class="tip">Ghi âm cần Chrome hoặc Safari và cho phép micro. Điểm do máy nhận giọng nói chấm, chỉ để em tự luyện. Máy chưa nghe kỹ từng âm nhỏ như âm cuối, nên hãy nghe mẫu và so lại nhé.</div>';
  h+='<div class="secbar"><div class="secs" role="tablist" aria-label="Mục ôn tập">'+TABS.map(function(t){return '<button type="button" class="sec" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>';}).join('')+'</div></div>';
  h+='<main class="stack">'+(TAB==='flash'?rFlash():(TAB==='story'?rStory():rPic()))+(location.hash==='#script'?rScriptList():'')+'</main><p class="foot">Điểm cao nhất của em được lưu trên trình duyệt này.</p></div>';
  $('app').innerHTML=h;
}

document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest){return;}
  var au=t.closest('[data-au]');if(au){playAu(au);return;}
  var rc=t.closest('[data-rec]');if(rc){startRec(parseInt(rc.getAttribute('data-rec'),10),rc);return;}
  var tb=t.closest('[data-tab]');if(tb){TAB=tb.getAttribute('data-tab');render();window.scrollTo(0,0);return;}
  var dk=t.closest('[data-deck]');if(dk){FS.deck=dk.getAttribute('data-deck');FS.idx=0;FS.flip=false;render();return;}
  var on=t.closest('[data-only]');if(on){FS.only=on.getAttribute('data-only')==='1';FS.idx=0;FS.flip=false;render();return;}
  var sy=t.closest('[data-story]');if(sy){SEL.story=parseInt(sy.getAttribute('data-story'),10);render();return;}
  var pc=t.closest('[data-pic]');if(pc){SEL.pic=parseInt(pc.getAttribute('data-pic'),10);render();return;}
  var mk=t.closest('[data-mark]');if(mk){
    var L=curList(),its=items();
    if(L.length){
      var it=its[L[FS.idx%L.length]],yes=mk.getAttribute('data-mark')==='1';
      if(yes){S.known[kOf(FS.deck,it)]=1;}else{delete S.known[kOf(FS.deck,it)];}
      save();
      if(!(FS.only&&yes)){FS.idx++;}
    }
    FS.flip=false;render();return;
  }
  var ac=t.closest('[data-act]');if(!ac){return;}
  var act=ac.getAttribute('data-act'),n=curList().length||1;
  if(act==='flip'){FS.flip=!FS.flip;render();}
  else if(act==='next'){FS.idx=(FS.idx+1)%n;FS.flip=false;render();}
  else if(act==='prev'){FS.idx=(FS.idx-1+n)%n;FS.flip=false;render();}
  else if(act==='shuffle'){shuffle();render();}
  else if(act==='resetk'){
    items().forEach(function(it){delete S.known[kOf(FS.deck,it)];});
    save();FS.only=false;FS.idx=0;FS.flip=false;render();
  }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('data-act')==='flip'&&t.getAttribute('role')==='button'){e.preventDefault();FS.flip=true;render();}
});
window.addEventListener('hashchange',render);
render();
})();
