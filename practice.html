    else{var d=shuf(pl.filter(function(x){return x.w!==it.w})).slice(0,2).map(function(x){return x.w});c.opts=shuf([it.w].concat(d));c.ans=it.w}
  }
  if(type==="order"){var n=sentOf(it).split(/\s+/).length;c.perm=shuf(sentOf(it).split(/\s+/).map(function(x,i){return i}));var same=c.perm.every(function(v,i){return v===i});if(same){c.perm.reverse()}}
  return c;
}
var Q=null,MEM=null,RACE=null;
function newSession(){
  var d=[];pool().forEach(function(it){shuf(elig(it)).slice(0,3).forEach(function(t){d.push([it,t])})});
  Q={cards:shuf(d).slice(0,12).map(function(x){return newCard(x[0],x[1],false)}),i:0,stars:0};
}
/* ============ GIAO DIỆN CHUNG ============ */
function render(){
  stopA();
  var h='<header class="top"><h1>Ôn tập tiếng Anh</h1><div class="row" style="margin:0"><span class="stars" aria-label="Tổng số sao">★ '+ST.total+'</span><a class="lnk" href="roadmap.html">← Lộ trình</a></div></header>';
  h+='<div class="row scr"><span class="lab">Chọn bài</span>'+DATA.map(function(u){return'<button class="chip'+(ST.unit===u[0]?" on":"")+'" data-act="unit" data-u="'+u[0]+'">'+u[1]+'</button>'}).join("")+'<button class="chip'+(ST.unit==="all"?" on":"")+'" data-act="unit" data-u="all">Trộn tất cả</button></div>';
  h+='<div class="tabs" role="tablist">'+[["cards","Thẻ ôn tập"],["memory","Ghép cặp"],["race","Đua 60 giây"]].map(function(t){return'<button class="tab'+(ST.view===t[0]?" on":"")+'" role="tab" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+=ST.view==="cards"?rCards():(ST.view==="memory"?rMem():rRace());
  $("app").innerHTML=h;
}
/* ============ THẺ ÔN TẬP: lật ra là làm bài ngay ============ */
function rCards(){
  if(!Q)newSession();
  var h='<div class="sc"><span>Thẻ '+Math.min(Q.i+1,Q.cards.length)+'/'+Q.cards.length+'</span><span>★ '+Q.stars+' · Tổng ★ '+ST.total+'</span></div><div class="bar">'+Q.cards.map(function(c,i){return'<i class="'+(i<Q.i?"d":(i===Q.i?"n":""))+'"></i>'}).join("")+'</div>';
  if(Q.i>=Q.cards.length){return h+'<div class="mid"><div class="star">★ '+Q.stars+'</div><h2>Em hoàn thành lượt chơi!</h2><p class="vi">Em được '+Q.stars+' sao nhờ trả lời đúng ngay lần đầu.</p><button class="btn" data-act="again">Chơi lượt mới</button></div>'}
  var c=Q.cards[Q.i],T=TY[c.type];
  return h+'<div class="scene"><div class="card'+(c.flip?" on":"")+'" id="card" style="--tc:'+T.c+'"><div class="face front" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ"><div><div class="bd">'+T.n+'</div><div class="no">Chạm để lật thẻ</div></div></div><div class="face back" id="back">'+back(c)+'</div></div></div>';
}
function back(c){
  var it=c.it,T=TY[c.type],h='<div><span class="badge">'+T.n+'</span></div>',tgt=sentOf(it);
  if(c.type==="listen"){
    h+='<div class="q">Nghe rồi chọn đáp án đúng</div><button class="hear" data-act="hear">'+SPK+'Nghe lại</button><div class="opts'+(c.L.pic?"":" t")+'">'+c.L.o.map(function(o,i){var cl=c.done?(i===c.L.a?" ok":(i===c.pick?" no":"")):"";return'<button class="opt'+cl+'" data-act="opt" data-i="'+i+'"'+(c.done?" disabled":"")+'>'+(c.L.pic?art(o.pic):esc(o.vi))+'</button>'}).join("")+'</div>';
  }else if(c.type==="cloze"){
    var s=it.k==="g"?esc(it.pre)+'<span class="blank"></span>'+esc(it.post):(function(){var p=it.ex.toLowerCase().indexOf(it.w.toLowerCase());return esc(it.ex.slice(0,p))+'<span class="blank"></span>'+esc(it.ex.slice(p+it.w.length))})();
    h+='<div class="q">Chọn từ đúng điền vào chỗ trống</div><div class="sentence">'+s+'</div>'+(it.k==="w"?'<div class="vi">('+esc(it.vi)+')</div>':"")+'<div class="opts t">'+c.opts.map(function(o,i){var cl=c.done?(o===c.ans?" ok":(i===c.pick?" no":"")):"";return'<button class="opt'+cl+'" data-act="opt" data-i="'+i+'"'+(c.done?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
  }else if(c.type==="speak"){
    h+='<div class="q">'+(it.k==="w"?"Nói bằng tiếng Anh":"Đọc to câu này")+'</div>'+(it.pic?'<div class="pic">'+art(it.pic)+'</div>':"")+(it.k==="w"?'<div class="sentence">'+esc(it.vi)+'</div>':'<div class="sentence">'+esc(tgt)+'</div>');
    if(!c.done){h+=c.noSR?'<button class="btn" data-act="selfdone">Mình đã nói xong</button>':'<button class="btn" data-act="mic"'+(c.listening?" disabled":"")+'>'+(c.listening?"Đang nghe... hãy nói":"Bấm rồi nói")+'</button>'}
    if(c.heard){h+='<div class="fb i">Máy nghe được: "'+esc(c.heard)+'"</div>'}
  }else if(c.type==="order"){
    var tk=tgt.split(/\s+/);
    h+='<div class="q">Nghe rồi xếp các từ thành câu</div><button class="hear" data-act="hear">'+SPK+'Nghe câu</button><div class="slot">'+c.sel.map(function(k,p){return'<button class="tok s" data-act="tokx" data-p="'+p+'"'+(c.done?" disabled":"")+'>'+esc(tk[k])+'</button>'}).join("")+'</div><div class="row">'+c.perm.filter(function(k){return c.sel.indexOf(k)<0}).map(function(k){return'<button class="tok" data-act="tok" data-k="'+k+'"'+(c.done?" disabled":"")+'>'+esc(tk[k])+'</button>'}).join("")+'</div>';
    if(!c.done)h+='<button class="btn" data-act="check">Kiểm tra</button>';
  }else{
    h+='<div class="q">Gõ từ tiếng Anh</div>'+(it.pic?'<div class="pic">'+art(it.pic)+'</div>':"")+'<div class="sentence">'+esc(it.vi)+'</div><input class="inp" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gõ từ"'+(c.done?" disabled":"")+'>';
    if(!c.done)h+='<button class="btn" data-act="check">Kiểm tra</button>';
  }
  if(c.msg){h+='<div class="fb '+(c.ok===true?"ok":(c.ok===false?"no":"i"))+'">'+c.msg+'</div>'}
  if(c.done){h+='<button class="btn" data-act="next">Thẻ tiếp</button>'}
  return h;
}
function cur(){return Q&&Q.cards[Q.i]}
function paintBack(){var b=$("back");if(b){b.innerHTML=back(cur())}}
function finish(c,ok,msg){
  c.done=true;c.ok=ok;c.msg=msg;
  if(ok&&c.tries<=1){Q.stars++;ST.total++;save()}
  if(!ok&&!c.rq){Q.cards.push(newCard(c.it,c.type,true))}
  var h=document.querySelector(".sc"),sr=document.querySelector(".stars");if(sr)sr.textContent="★ "+ST.total;paintBack();if(h){h.lastChild.textContent="★ "+Q.stars+" · Tổng ★ "+ST.total}
}
function check(){
  var c=cur(),it=c.it,tgt=sentOf(it);c.tries++;var ok;
  if(c.type==="type"){ok=norm($("ti").value)===norm(it.w)}
  else{var tk=tgt.split(/\s+/);ok=norm(c.sel.map(function(k){return tk[k]}).join(" "))===norm(tgt)}
  if(ok){finish(c,true,"Đúng rồi! "+esc(c.type==="type"?it.w:tgt))}
  else if(c.tries>=2){finish(c,false,"Đáp án là: <b>"+esc(c.type==="type"?it.w:tgt)+"</b>. Thẻ này sẽ quay lại sau.")}
  else{c.msg="Chưa đúng, em thử lại một lần nữa nhé.";c.ok=false;paintBack()}
}
function mic(){
  var c=cur(),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){c.noSR=true;paintBack();return}
  var r=new SR(),tgt=sentOf(c.it);r.lang="en-GB";r.maxAlternatives=3;r.interimResults=false;c.listening=true;c.msg="";paintBack();
  r.onresult=function(e){
    var best=-1,h="",l=e.results[0];for(var j=0;j<l.length;j++){var s=sim(tgt,l[j].transcript);if(s>best){best=s;h=l[j].transcript}}
    c.listening=false;c.tries++;c.heard=norm(h);
    if(best>=70){finish(c,true,"Rất tốt! Em nói đúng "+best+"%.")}
    else if(c.tries>=2){say(tgt);finish(c,false,"Em nghe mẫu rồi luyện thêm nhé. Thẻ này sẽ quay lại sau.")}
    else{c.msg="Em được "+best+"%. Nói chậm và rõ hơn, thử lại nhé.";c.ok=false;paintBack()}
  };
  r.onerror=function(){c.listening=false;c.msg="Chưa nghe thấy giọng em. Hãy thử lại nhé.";c.ok=false;paintBack()};
  r.onend=function(){if(c.listening){c.listening=false;paintBack()}};
  try{r.start()}catch(e){c.listening=false;c.noSR=true;paintBack()}
}
/* ============ GHÉP CẶP ============ */
function startMem(){
  var its=shuf(pool(true)).slice(0,6),t=[];
  its.forEach(function(it,i){t.push({i:i,it:it,side:"a"},{i:i,it:it,side:"b"})});
  MEM={t:shuf(t),up:[],found:0,moves:0,lock:false,its:its};
}
function rMem(){
  if(!MEM)startMem();
  var h='<div class="sc"><span>Lật hai ô giống nhau: hình (hoặc nghĩa) và từ tiếng Anh</span><span>'+MEM.moves+' lượt</span></div><div class="grid" style="margin-top:10px">';
  MEM.t.forEach(function(x,n){
    var on=x.m||MEM.up.indexOf(n)>=0;
    h+='<button class="tile'+(on?" up":"")+(x.m?" m":"")+'" data-act="tile" data-n="'+n+'" aria-label="'+(on?(x.side==="a"?esc(x.it.vi):esc(x.it.w)):"Ô úp")+'">'+(on?(x.side==="b"?esc(x.it.w):(x.it.pic?art(x.it.pic):esc(x.it.vi))):"?")+'</button>';
  });
  h+='</div>';
  if(MEM.found===MEM.its.length){h+='<div class="mid" style="margin-top:12px"><div class="star">★</div><h2>Em ghép đúng hết '+MEM.its.length+' cặp!</h2><p class="vi">Chỉ mất '+MEM.moves+' lượt.</p><button class="btn" data-act="memagain">Chơi ván mới</button></div>'}
  return h;
}
function tile(n){
  var x=MEM.t[n];if(MEM.lock||x.m||MEM.up.indexOf(n)>=0)return;
  MEM.up.push(n);if(x.side==="b")say(x.it.w);
  if(MEM.up.length===2){
    MEM.moves++;var a=MEM.t[MEM.up[0]],b=MEM.t[MEM.up[1]];
    if(a.i===b.i&&a.side!==b.side){a.m=b.m=true;MEM.found++;MEM.up=[];ST.total++;save()}
    else{var m=MEM;m.lock=true;render();setTimeout(function(){m.up=[];m.lock=false;if(MEM===m)render()},1100);return}
  }
  render();
}
/* ============ ĐUA 60 GIÂY ============ */
var RT=null;
function rQ(){var it=shuf(pool(true))[0];RACE.q={it:it,L:mkListen(it,pool(true))};setTimeout(function(){if(RACE&&RACE.run)say(it.w)},150)}
function rRace(){
  if(!RACE){return'<div class="mid"><h2>Đua 60 giây</h2><p class="vi">Nghe từ rồi chọn thật nhanh. Mỗi câu đúng được 1 điểm.<br>Kỷ lục của em: '+(ST.best["race:"+ST.unit]||0)+'</p><button class="btn" data-act="rstart">Bắt đầu</button></div>'}
  if(!RACE.run){return'<div class="mid"><div class="star">'+RACE.score+'</div><h2>Hết giờ! Em được '+RACE.score+' điểm</h2><p class="vi">Kỷ lục: '+(ST.best["race:"+ST.unit]||0)+'</p><button class="btn" data-act="rstart">Chơi lại</button></div>'}
  var q=RACE.q;
  return'<div class="sc"><span class="tm" id="tm">'+RACE.t+' giây</span><span>Điểm '+RACE.score+'</span></div><div class="mid" style="margin-top:10px;--tc:#2F5BEA"><button class="hear" data-act="rhear">'+SPK+'Nghe lại</button><div class="opts'+(q.L.pic?"":" t")+'" style="width:100%">'+q.L.o.map(function(o,i){return'<button class="opt" data-act="ropt" data-i="'+i+'">'+(q.L.pic?art(o.pic):esc(o.vi))+'</button>'}).join("")+'</div></div>';
}
function rStart(){
  clearInterval(RT);RACE={t:60,score:0,run:true,q:null};rQ();
  RT=setInterval(function(){RACE.t--;var e=$("tm");if(e)e.textContent=RACE.t+" giây";if(RACE.t<=0){clearInterval(RT);RACE.run=false;var k="race:"+ST.unit;if(RACE.score>(ST.best[k]||0)){ST.best[k]=RACE.score}ST.total+=RACE.score;save();render()}},1000);
  render();
}
/* ============ SỰ KIỆN ============ */
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),c=Q&&cur();
  if(a==="unit"){ST.unit=b.getAttribute("data-u");save();Q=null;MEM=null;RACE=null;clearInterval(RT);render()}
  else if(a==="tab"){ST.view=b.getAttribute("data-v");save();clearInterval(RT);if(RACE&&RACE.run)RACE=null;render()}
  else if(a==="flip"){document.getElementById("card").classList.add("on");c.flip=true;if(c.type==="listen")say(c.it.w);if(c.type==="order")say(sentOf(c.it));if(c.type==="type"){setTimeout(function(){var i=$("ti");if(i)i.focus()},500)}}
  else if(a==="hear"){say(c.type==="listen"?c.it.w:sentOf(c.it))}
  else if(a==="opt"){var i=+b.getAttribute("data-i");c.tries++;c.pick=i;var ok=c.type==="listen"?i===c.L.a:c.opts[i]===c.ans;
    if(ok){finish(c,true,"Đúng rồi! "+esc(c.type==="listen"?c.it.w:sentOf(c.it)))}else{finish(c,false,"Đáp án là <b>"+esc(c.type==="listen"?c.it.w:c.ans)+"</b>. Thẻ này sẽ quay lại sau.")}}
  else if(a==="tok"){c.sel.push(+b.getAttribute("data-k"));c.msg="";paintBack()}
  else if(a==="tokx"){c.sel.splice(+b.getAttribute("data-p"),1);paintBack()}
  else if(a==="check"){check()}
  else if(a==="mic"){mic()}
  else if(a==="selfdone"){c.tries=1;finish(c,true,"Giỏi lắm!")}
  else if(a==="next"){Q.i++;render()}
  else if(a==="again"){newSession();render()}
  else if(a==="tile"){tile(+b.getAttribute("data-n"))}
  else if(a==="memagain"){startMem();render()}
  else if(a==="rstart"){rStart()}
  else if(a==="rhear"){say(RACE.q.it.w)}
  else if(a==="ropt"){if(+b.getAttribute("data-i")===RACE.q.L.a){RACE.score++}rQ();render()}
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("data-act")==="flip"){e.preventDefault();t.click()}
  else if(e.key==="Enter"&&t.id==="ti"){check()}
});
render();
})();
</script></body></html>
