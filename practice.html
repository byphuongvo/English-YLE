.scr .chip{white-space:nowrap}
.spd{align-items:center}
.tabs{grid-template-columns:repeat(5,1fr);gap:6px}.tab{font-size:.9rem;padding:10px 2px}

  h+='</div>';
  if(c.lv===0&&c.opts){h+='<div class="row" style="justify-content:center">'+c.opts.map(function(o,i){var cl=c.done?(o===c.optAns?" ok":(i===c.pk?" no":"")):"";return'<button class="opt rvo'+cl+'" data-act="ro" data-i="'+i+'"'+(c.done?" disabled":"")+'>'+(c.mode==="letter"?"-"+esc(o):esc(o))+'</button>'}).join("")+'</div>'}
  else if(!c.done){h+='<div class="row" style="justify-content:center"><button class="btn" data-act="rcheck">Kiểm tra</button><button class="btn g" data-act="rhint">Gợi ý</button></div>'}
  if(c.msg){h+='<div class="fb '+(c.ok===true?"ok":(c.ok===false?"no":"i"))+'">'+c.msg+'</div>'}
  return h;
}
function rvBack(c){
  var it=c.it,h='<div><span class="badge">Ôn thẻ</span></div><div class="bd2">'+esc(it.w)+hearBtn(it.w)+'</div><div class="sentence" style="text-align:left">'+esc(it.vi)+'</div>';
  var ps=[];ITEMS.forEach(function(x){if(x.k==="w"&&x.pos&&ps.indexOf(x.pos)<0)ps.push(x.pos)});
  if(it.pos&&c.posPick<0&&ps.length>=2){
    c.popts=c.popts||shuf([it.pos].concat(shuf(ps.filter(function(p){return p!==it.pos})).slice(0,2)));
    h+='<div class="q">Từ này thuộc loại nào?</div><div class="opts t">'+c.popts.map(function(p,i){return'<button class="opt" data-act="rpos" data-i="'+i+'">'+esc(posLabel(p))+'</button>'}).join("")+'</div>';
  }else{
    if(it.pos){h+='<div class="fb '+(c.posPick===1?"ok":"i")+'">'+(c.posPick===1?"Đúng rồi! ":"")+"Loại từ: <b>"+esc(posLabel(it.pos))+"</b></div>"}
    var ex=[it.ex,it.ex2].filter(function(x,i,a){return x&&a.indexOf(x)===i});
    if(ex.length){h+='<div class="exb"><div class="lab">Ví dụ</div>'+ex.map(function(s){return'<div class="exr"><span>'+esc(s)+'</span>'+hearBtn(s)+'</div>'}).join("")+'</div>'}
    h+='<button class="btn" data-act="rnext">Thẻ tiếp</button>';
  }
  return h;
}
function rReview(){
  if(!RV)newReview();
  var n=RV.cards.length,h=lvBar()+'<div class="sc"><span>Thẻ '+Math.min(RV.i+1,n)+'/'+n+'</span><span>★ '+RV.stars+' · Tổng ★ '+ST.total+'</span></div><div class="bar">'+RV.cards.map(function(c,i){return'<i class="'+(i<RV.i?"d":(i===RV.i?"n":""))+'"></i>'}).join("")+'</div>';
  if(!n){return h+'<div class="mid"><p class="vi">Bài này chưa có từ nào.</p></div>'}
  if(RV.i>=n){
    var up=(RV.first===RV.cards.length&&(ST.rlv||0)<9);
    var nx=[0,1,2,3,9][[0,1,2,3,9].indexOf(ST.rlv||0)+1];
    return h+'<div class="mid"><div class="star">★ '+RV.stars+'</div><h2>Em hoàn thành lượt ôn!</h2><p class="vi">'+(up?"Em đúng hết ngay lần đầu. Thử cấp khó hơn nhé!":"Em được "+RV.stars+" sao nhờ đúng ngay lần đầu.")+'</p><div class="row" style="justify-content:center">'+(up?'<button class="btn" data-act="rlv" data-v="'+nx+'">Cấp khó hơn</button>':"")+'<button class="btn'+(up?" g":"")+'" data-act="ragain">Ôn lượt mới</button></div></div>';
  }
  var c=RV.cards[RV.i];
  return h+'<div class="scene"><div class="card'+(c.stage==="b"?" on":"")+'" id="card" style="--tc:#7A4FD6"><div class="face front" id="rf" style="background:var(--card);color:var(--ink);border:3px solid var(--tc);display:grid;gap:12px;align-content:start;cursor:default">'+rvFront(c)+'</div><div class="face back" id="rb">'+rvBack(c)+'</div></div></div>';
}
function rvCur(){return RV&&RV.cards[RV.i]}
function rvPaint(){var c=rvCur(),f=$("rf"),b=$("rb");if(!c||!f)return;var act=document.activeElement,ak=act&&act.getAttribute&&act.getAttribute("data-k");var vals={};[].forEach.call(f.querySelectorAll("input"),function(i){vals[(i.getAttribute("data-k")||"x")+":"+(i.getAttribute("data-n")||"")]=i.value});f.innerHTML=rvFront(c);b.innerHTML=rvBack(c);[].forEach.call(f.querySelectorAll("input"),function(i){var k=(i.getAttribute("data-k")||"x")+":"+(i.getAttribute("data-n")||"");if(vals[k]&&!i.value)i.value=vals[k]})}
function rvFinish(c,ok,msg){
  c.done=true;c.ok=ok;c.msg=msg||"";
  if(ok&&c.tries<=1&&!c.hint){RV.stars++;RV.first++;ST.total++;save()}
  if(!ok&&!c.rq){RV.cards.push(mkRv(c.it,true))}
  rvPaint();var s=document.querySelector(".sc");if(s)s.lastChild.textContent="★ "+RV.stars+" · Tổng ★ "+ST.total;
  setTimeout(function(){var cd=$("card");if(cd&&rvCur()===c){c.stage="b";cd.classList.add("on")}},ok?700:1300);
}
function rvWrong(c,fix){
  c.tries++;
  if(c.tries>=3){rvFinish(c,false,"Đáp án là <b>"+esc(c.it.w)+"</b>. Thẻ này sẽ quay lại sau.")}
  else{c.msg="Chưa đúng"+(fix||"")+", em thử lại nhé.";c.ok=false;rvPaint()}
}
function rvCheck(){
  var c=rvCur();if(!c||c.done)return;var it=c.it,f=$("rf"),ok=true;
  var ins=[].slice.call(f.querySelectorAll("input"));
  if(!ins.length)return;
  if(ins.some(function(i){return!i.value.trim()})){c.msg="Em điền hết các ô trống rồi bấm Kiểm tra nhé.";c.ok=false;rvPaint();return}
  if(c.mode==="word"){
    var toks=it.w.split(" ");ins.forEach(function(i){var k=+i.getAttribute("data-k");if(norm(i.value)!==norm(toks[k])){ok=false;i.classList.add("bad")}else{i.classList.add("good")}});
  }else if(c.lv===9){ok=norm(ins[0].value)===norm(it.w);ins[0].classList.add(ok?"good":"bad")}
  else{ins.forEach(function(i){var k=+i.getAttribute("data-k");if(i.value.trim().toLowerCase()!==it.w[k].toLowerCase()){ok=false;i.classList.add("bad")}else{i.classList.add("good")}})}
  if(ok){rvFinish(c,true,"Đúng rồi!")}
  else{c.tries++;if(c.tries>=3){rvFinish(c,false,"Đáp án là <b>"+esc(it.w)+"</b>. Thẻ này sẽ quay lại sau.")}else{var m=f.querySelector(".fb");c.msg="Chưa đúng, ô viền đỏ cần sửa lại nhé.";c.ok=false;var d=f.querySelector(".fb")||document.createElement("div");d.className="fb no";d.textContent=c.msg;if(!d.parentNode)f.appendChild(d)}}
}
function rvHint(){
  var c=rvCur();if(!c||c.done)return;var f=$("rf"),it=c.it,ins=[].slice.call(f.querySelectorAll("input")).filter(function(i){return!i.disabled});
  for(var q=0;q<ins.length;q++){
    var i=ins[q],k=+i.getAttribute("data-k");
    if(c.mode==="word"){var t=it.w.split(" ")[k];if(norm(i.value)!==norm(t)){i.value=t.slice(0,1);c.hint=true;i.focus();return}}
    else if(c.lv===9){var cur0=i.value,tgt=it.w;var n=0;while(n<cur0.length&&cur0[n].toLowerCase()===tgt[n].toLowerCase())n++;i.value=tgt.slice(0,Math.min(n+1,tgt.length));c.hint=true;i.focus();return}
    else if(i.value.trim().toLowerCase()!==it.w[k].toLowerCase()){i.value=it.w[k];c.hint=true;i.focus();return}
  }
}
function newActs(a,b){
  if(a==="say"){say(b.getAttribute("data-t"));return true}
  if(a==="rate"){try{localStorage.setItem("yle-rate",b.getAttribute("data-v"))}catch(e){}render();return true}
  if(a==="lflip"){var cd=$("card");if(cd){cd.classList.add("on");var it0=LRN.cards[LRN.i];if(it0)say(it0.w)}return true}
  if(a==="lyes"||a==="lno"){
    var it=LRN.cards[LRN.i];
    if(a==="lyes"){LRN.ok++;ST.known[it.w]=1;save()}
    else if(!LRN.req[it.w]){LRN.req[it.w]=1;LRN.cards.push(it)}
    LRN.i++;render();return true}
  if(a==="lagain"){newLearn();render();return true}
  if(a==="rlv"){ST.rlv=+b.getAttribute("data-v");save();newReview();ST.view="review";render();return true}
  if(a==="ragain"){newReview();render();return true}
  if(a==="rcheck"){rvCheck();return true}
  if(a==="rhint"){rvHint();return true}
  if(a==="ro"){
    var c=rvCur(),i=+b.getAttribute("data-i");c.pk=i;
    if(c.opts[i]===c.optAns){c.tries++;rvFinish(c,true,"Đúng rồi!")}
    else{c.tries++;if(c.tries>=2){rvFinish(c,false,"Đáp án là <b>"+esc(c.it.w)+"</b>. Thẻ này sẽ quay lại sau.")}else{c.msg="Chưa đúng, em chọn lại nhé.";c.ok=false;rvPaint();b.disabled=true}}
    return true}
  if(a==="rpos"){var c2=rvCur(),i2=+b.getAttribute("data-i");c2.posPick=(c2.popts[i2]===c2.it.pos)?1:2;var bk=$("rb");if(bk)bk.innerHTML=rvBack(c2);return true}
  if(a==="rnext"){RV.i++;render();return true}
  return false;
}
/* ============ SỰ KIỆN ============ */
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),c=Q&&cur();
  if(newActs(a,b)){return}
  if(a==="unit"){ST.unit=b.getAttribute("data-u");save();Q=null;MEM=null;RACE=null;LRN=null;RV=null;clearInterval(RT);render()}
  else if(a==="tab"){ST.view=b.getAttribute("data-v");save();clearInterval(RT);if(RACE&&RACE.run)RACE=null;render()}
  else if(a==="flip"){document.getElementById("card").classList.add("on");c.flip=true;if(c.type==="listen")say(c.it.w);if(c.type==="order")say(sentOf(c.it));if(c.type==="type"){setTimeout(function(){var i=$("ti");if(i)i.focus()},500)}}
  else if(a==="hear"){say(c.type==="listen"?c.it.w:sentOf(c.it))}
  else if(a==="opt"){var i=+b.getAttribute("data-i");c.tries++;c.pick=i;var ok=c.type==="listen"?i===c.L.a:c.opts[i]===c.ans;
    if(ok){finish(c,true,"Đúng rồi! "+esc(c.type==="listen"?c.it.w:sentOf(c.it)))}else{finish(c,false,"Đáp án là <b>"+esc(c.type==="listen"?c.it.w:c.ans)+"</b>. Thẻ này sẽ quay lại sau.")}}
  else if(a==="tok"){c.sel.push(+b.getAttribute("data-k"));c.msg="";paintBack()}
  else if(a==="tokx"){c.sel.splice(+b.getAttribute("data-p"),1);paintBack()}
  else if(a==="check"){check()}
  else if(a==="mic"){mic()}
  else if(a==="selfdone"){c.tries=1;finish(c,true,"Giỏi lắm!")}
  else if(a==="next"){Q.i++;render()}
  else if(a==="again"){newSession();render()}
  else if(a==="tile"){tile(+b.getAttribute("data-n"))}
  else if(a==="memagain"){startMem();render()}
  else if(a==="rstart"){rStart()}
  else if(a==="rhear"){say(RACE.q.it.w)}
  else if(a==="ropt"){if(+b.getAttribute("data-i")===RACE.q.L.a){RACE.score++}rQ();render()}
});
document.addEventListener("input",function(e){var t=e.target;if(t.classList&&t.classList.contains("lt")){t.classList.remove("bad","good");if(t.value){var ls=[].slice.call(document.querySelectorAll("#rf input.lt")),lx=ls.indexOf(t);if(lx>=0&&lx<ls.length-1)ls[lx+1].focus()}}});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("data-act")==="flip"){e.preventDefault();t.click()}
  else if(e.key==="Enter"&&t.id==="ti"){check()}
  else if(e.key==="Enter"&&t.classList&&(t.classList.contains("lt")||t.classList.contains("wi")||t.id==="rwi")){e.preventDefault();var ins=[].slice.call(document.querySelectorAll("#rf input")),ix=ins.indexOf(t);if(ix>=0&&ix<ins.length-1&&t.classList.contains("wi")){ins[ix+1].focus()}else{rvCheck()}}
  else if(e.key==="Backspace"&&t.classList&&t.classList.contains("lt")&&!t.value){var ls=[].slice.call(document.querySelectorAll("#rf input.lt")),lx=ls.indexOf(t);if(lx>0){ls[lx-1].focus()}}
});
if(/[?&]embed=1/.test(location.search)){document.body.classList.add("embed")}
hv();
window.addEventListener("hashchange",function(){hv();clearInterval(RT);if(RACE&&RACE.run)RACE=null;render()});
$("app").innerHTML='<p class="vi" style="padding:40px 0">Đang tải bài...</p>';
loadData().then(function(d){buildItems(d.units||[]);render()});
})();
