var AUTXT={},AUEL={},curBtn=null,curAudio=null;
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.500a5 5 0 0 1 0 7M18.500 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function auBtn(au,label){
  var id=aid(au);AUTXT[id]=auText(au);
  if(label){return '<button type="button" class="playlong" data-au="'+id+'">'+SPK+esc(label)+'</button>';}
  return '<button type="button" class="play" data-au="'+id+'" aria-label="Nghe">'+SPK+'</button>';
}
function stopAll(){
  try{if(window.speechSynthesis){window.speechSynthesis.cancel();}}catch(e){}
  if(curAudio){try{curAudio.pause();}catch(e){}}
  if(curBtn){curBtn.classList.remove('on');curBtn=null;}
}
function speakFallback(text,btn){
  try{
    var syn=window.speechSynthesis;if(!syn||typeof SpeechSynthesisUtterance==='undefined'){return;}
    var u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.8;
    var vs=syn.getVoices();var gb=vs.filter(function(x){return /^en[-_]GB/i.test(x.lang);});
    var pref=/daniel|serena|kate|libby|sonia|oliver|martha|google uk/i;
    var v=gb.filter(function(x){return pref.test(x.name);})[0]||gb[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v){u.voice=v;u.lang=v.lang;}
    u.onend=function(){if(btn){btn.classList.remove('on');}};
    syn.speak(u);
  }catch(e){}
}
function playAu(btn){
  var id=btn.getAttribute('data-au');
  var same=(curBtn===btn);
  stopAll();
  if(same){return;}
  curBtn=btn;btn.classList.add('on');
  var a=AUEL[id];
  if(!a){a=new Audio('audio/'+id+'.mp3');a.preload='auto';AUEL[id]=a;a.addEventListener('ended',function(){if(curBtn===btn){btn.classList.remove('on');curBtn=null;}});}
  curAudio=a;
  try{a.currentTime=0;}catch(e){}
  var p=a.play();
  if(p&&p.catch){p.catch(function(){speakFallback(AUTXT[id],btn);});}
}

/* ---------- chấm phát âm ---------- */
var NUM={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen','16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen','20':'twenty'};
function words(s){
  s=String(s||'').toLowerCase().replace(/[‘’]/g,"'");
  s=s.replace(/'s\b/g,'').replace(/\b\d+\b/g,function(m){return NUM[m]||m;});
  return s.replace(/[^a-z' ]+/g,' ').split(/\s+/).filter(Boolean);
}
function align(T,Sp){
  var n=T.length,m=Sp.length,d=[],i,j;
  for(i=0;i<=n;i++){d.push([]);for(j=0;j<=m;j++){d[i].push(0);}}
  for(i=1;i<=n;i++){for(j=1;j<=m;j++){d[i][j]=(T[i-1]===Sp[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);}}
  var hit=T.map(function(){return false;});
  i=n;j=m;
  while(i>0&&j>0){
    if(T[i-1]===Sp[j-1]){hit[i-1]=true;i--;j--;}
    else if(d[i-1][j]>=d[i][j-1]){i--;}
    else{j--;}
  }
  return {hit:hit,hits:d[n][m],extra:Math.max(m-d[n][m],0)};
}
function scoreOne(T,Sp){
  var a=align(T,Sp);
  var sc=T.length?Math.round(100*a.hits/T.length):0;
  a.score=Math.max(0,sc-Math.min(10,a.extra*3));
  return a;
}
function resultHtml(target,alts){
  var T=words(target),best=null,bt='',bc=0;
  alts.forEach(function(a){
    var r=scoreOne(T,words(a.t)),c=Number(a.c)||0;
    if(!best||r.score>best.score||(r.score===best.score&&c>bc)){best=r;bt=a.t;bc=c;}
  });
  var sc=best.score;
  var spans=T.map(function(w,i){return '<span class="w '+(best.hit[i]?'ok':'no')+'">'+esc(w)+'</span>';}).join(' ');
  var label=sc>=90?'Rất tốt!':(sc>=70?'Khá tốt, luyện thêm vài từ.':(sc>=40?'Cần luyện thêm, nghe mẫu rồi thử lại.':'Thử lại chậm và rõ hơn nhé.'));
  var spoken=words(bt),miss=[],tips=[];

  miss.forEach(function(w){

    }
  });
  if(miss.length){tips.push('Từ chưa rõ: '+miss.map(esc).join(', ')+'.');}
  var html='<div class="sc '+(sc>=70?'good':(sc>=40?'mid':'low'))+'"><b>'+sc+'/100</b> · '+label+'</div><div class="ws">'+spans+'</div><div class="m heard">Máy nghe được: "'+esc(bt||'')+'"</div>';
  if(tips.length){html+='<div class="tips">'+tips.join(' ')+'</div>';}

}

var ERRMSG={
  'not-allowed':'Em cần cho phép trình duyệt dùng micro (bấm vào biểu tượng ổ khoá cạnh địa chỉ trang rồi chọn cho phép).',
  'service-not-allowed':'Em cần cho phép trình duyệt dùng micro (bấm vào biểu tượng ổ khoá cạnh địa chỉ trang rồi chọn cho phép).',

  'network':'Cần có mạng để chấm phát âm. Hãy kiểm tra kết nối rồi thử lại.',

function startRec(i,btn){
  var item=REG[i],res=document.querySelector('[data-res="'+i+'"]');

    for(var j=0;j<list.length;j++){alts.push({t:list[j].transcript,c:list[j].confidence});}
    var out=resultHtml(item.t,alts);

  };

    if(!got){res.innerHTML='<div class="tips">Cô chưa nghe thấy giọng em. Hãy thử lại.</div>';}
  };

}

function shufIdx(n,seed){
  var a=[],i;for(i=0;i<n;i++){a.push(i);}
  var r=seed*9301+49297;
  for(i=n-1;i>0;i--){r=(r*9301+49297)%233280;var j=Math.floor(r/233280*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  var same=a.every(function(v,k){return v===k;});
  if(same){a.reverse();}
  return a;
}

  var u=U(),n=u.stories.length;if(SEL.story>=n){SEL.story=0;}
  var st=u.stories[SEL.story];
  var h='<section class="blk story"><div class="ctl">'+u.stories.map(function(s,i){return pk('story',i,i===SEL.story,s.title);}).join('')+'</div><h2>'+esc(st.title)+'</h2>';
  h+='<div class="ctx"><b>Tình huống:</b> '+esc(st.ctx)+'</div>';
  if(st.img){h+='<div class="storyimg">'+imgTag(st.img,'','storypic')+'</div>';}
  var all=D(st.lines.map(function(l){return [l[0],l[1]];}));
  h+='<div>'+auBtn(all,'Nghe cả đoạn')+'</div><p class="muted">Bấm loa nghe từng câu, rồi bấm Ghi âm và đọc lại. Em có thể đóng vai từng bạn trong đoạn hội thoại.</p>';
  h+='<div class="sents">';
  st.lines.forEach(function(l,i){
    h+='<div class="srow"><div class="stxt">'+auBtn(A(l[1],l[0]))+'<span><b class="who">'+esc(VOICE_NAME[l[0]]||l[0])+':</b> '+esc(l[1])+'</span></div><div class="muted">'+esc(l[2])+'</div>'+recBlock(l[1],'s:'+u.id+':'+SEL.story+':'+i,'Nói lại')+'</div>';
  });
  h+='</div><div class="use"><b>Dùng khi nào:</b> '+esc(st.use)+'</div></section>';
  return h;
}

/* --- vận dụng theo tình huống --- */
function rApply(){
  var u=U(),h='<section class="blk"><p class="muted">Đọc tình huống, chọn câu em sẽ nói, bấm Kiểm tra rồi nói to câu đúng.</p><div class="sents">';
  u.apply.forEach(function(a,i){
    h+='<div class="srow" data-ap="'+i+'"><div class="passage"><b>Tình huống '+(i+1)+'.</b> '+esc(a.ctx)+(a.q?'<div class="stxt">'+auBtn(A(a.q,a.qv),'Nghe')+'<span>"'+esc(a.q)+'"</span></div>':'')+'</div>';
    h+='<div class="opts" role="radiogroup" aria-label="Tình huống '+(i+1)+'">'+a.opts.map(function(o,k){var id='ap'+i+'-'+k;return '<label class="opt" for="'+id+'"><input type="radio" id="'+id+'" name="ap'+i+'" value="'+k+'"><span class="ot">'+esc(o)+'</span></label>';}).join('')+'</div>';
    h+='<div class="actions"><button type="button" class="btn sm" data-act="apcheck" data-i="'+i+'">Kiểm tra</button></div><div class="fb2" data-fbk="ap'+i+'"></div>';
    h+='<div class="aprec" data-aprec="'+i+'" hidden><div class="stxt">'+auBtn(A(a.say))+'<span>'+esc(a.say)+'</span></div>'+recBlock(a.say,'a:'+u.id+':'+i,'Nói câu đúng')+'</div></div>';
  });
  return h+'</div></section>';
}
function checkApply(i){
  var a=U().apply[i],r=document.querySelector('input[name="ap'+i+'"]:checked');
  if(!r){setFb('ap'+i,'Em chưa chọn.',null);return;}
  var ok=parseInt(r.value,10)===a.ans;
  setFb('ap'+i,ok?'Đúng rồi! '+esc(a.why):'Chưa đúng. Câu phù hợp là: <b>'+esc(a.say)+'</b>. '+esc(a.why),ok);
  var rec=document.querySelector('[data-aprec="'+i+'"]');if(rec){rec.hidden=false;}
  if(ok){markPrac('ap:'+S.unit+':'+i);}
}

/* --- tả tranh --- */
function sentRows(list,pre){
  return '<div class="sents">'+list.map(function(s,i){
    var t=typeof s==='string'?s:s.t;
    return '<div class="srow"><div class="stxt">'+auBtn(A(t))+'<span>'+esc(t)+'</span></div>'+recBlock(t,pre+':'+i,'Ghi âm câu này')+'</div>';
  }).join('')+'</div>';
}
function rPic(){
  var u=U(),n=u.pics.length;if(SEL.pic>=n){SEL.pic=0;}
  var p=u.pics[SEL.pic];
  var h='<section class="blk">'+(n>1?'<div class="ctl">'+u.pics.map(function(x,i){return pk('pic',i,i===SEL.pic,x.title);}).join('')+'</div>':'<h2>'+esc(p.title)+'</h2>');
  h+='<div class="storyimg">'+imgTag('pic-'+u.id+'-'+p.id,'','storypic')+'</div>';
  if(p.scene){h+='<div class="scenebox">'+SCENE[p.scene]()+'</div>';}
  else{h+='<div class="tile emorow">'+p.emojis.map(function(e){return '<span class="emo big4">'+e+'</span>';}).join('')+'</div>';}
  h+='<div class="tip">Em có thể đặt ảnh tranh trong sách vào images/'+esc('pic-'+u.id+'-'+p.id)+'.jpg để thay cho hình này.</div>';
  h+='<div><b>Khung câu gợi ý</b><ul class="frames">'+p.frames.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></div>';
  h+='<div>'+auBtn(A(p.sents.join(' ')),'Nghe cả bài mẫu')+'</div>'+sentRows(p.sents,'p:'+u.id+':'+p.id)+'</section>';
  return h;
}
function allAudio(){
  var out=[],seen={};
  function add(au){var id=aid(au);if(!seen[id]){seen[id]=1;out.push({id:id,t:auText(au)});}}
  UNITS.forEach(function(u){
    u.vocab.forEach(function(v){add(A(v.w));add(A(v.ex));});
    u.gram.forEach(function(g){add(A(g.full));});
    u.sents.forEach(function(s){add(A(s.t));});
    u.stories.forEach(function(s){add(D(s.lines.map(function(l){return [l[0],l[1]];})));s.lines.forEach(function(l){add(A(l[1],l[0]));});});
    u.drills.forEach(function(d){d.words.forEach(function(w){add(A(d.tpl.replace('{}',w)));});});
    u.apply.forEach(function(a){add(A(a.say));if(a.q){add(A(a.q,a.qv));}});
    u.pics.forEach(function(p){add(A(p.sents.join(' ')));p.sents.forEach(function(x){add(A(x));});});
  });
  return out;
}
function rScriptList(){
  var l=allAudio();
  return '<section class="blk"><h3>Danh sách file âm thanh cần thu ('+l.length+')</h3><p class="muted">Lưu mỗi file mp3 vào thư mục audio/ với đúng tên. Chưa có file thì trang tự dùng giọng đọc của trình duyệt.</p><div class="script">'
    +l.map(function(x){return '<div class="it"><code>audio/'+esc(x.id)+'.mp3</code><div>'+esc(x.t)+'</div></div>';}).join('')+'</div></section>';
}
function render(){
  stopRec();stopAll();REG=[];
  var u=U();
  var h='<div class="wrap"><header class="top"><div class="brand"><b>Ôn tập tiếng Anh</b><span>'+esc(u.title)+': '+esc(u.sub)+'</span></div><div class="row2"><a class="btn ghost sm lnk" href="roadmap.html">← Lộ trình</a></div></header>';
  h+='<div class="tip">Ghi âm cần Chrome hoặc Safari và cho phép micro. Điểm do máy nhận giọng nói chấm, chỉ để em tự luyện. Hãy nghe mẫu rồi so lại nhé.</div>';
  h+='<div class="ctl units" role="group" aria-label="Chọn Unit">'+UNITS.map(function(x){return pk('unit',x.id,x.id===S.unit,x.title);}).join('')+'</div>';
  h+='<div class="secbar"><div class="secs" role="tablist" aria-label="Mục ôn tập">'+TABS.map(function(t){return '<button type="button" class="sec" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>';}).join('')+'</div></div>';
  var body=TAB==='flash'?rFlash():(TAB==='write'?rWrite():(TAB==='word'?rWord():(TAB==='sent'?rSent():(TAB==='story'?rStory():(TAB==='apply'?rApply():rPic())))));
  h+='<main class="stack">'+body+(location.hash==='#script'?rScriptList():'')+'</main><p class="foot">Điểm cao nhất của em được lưu trên trình duyệt này. Ảnh từ sách: đặt vào thư mục images/ (xem hướng dẫn tên file bên dưới nếu cô cần).</p></div>';
  $('app').innerHTML=h;
}

document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest){return;}
  var au=t.closest('[data-au]');if(au){playAu(au);return;}
  var rc=t.closest('[data-rec]');if(rc){startRec(parseInt(rc.getAttribute('data-rec'),10),rc);return;}
  var un=t.closest('[data-unit]');if(un){S.unit=un.getAttribute('data-unit');FS.idx=0;FS.flip=false;FS.perm=null;SEL.story=0;SEL.pic=0;save();render();return;}
  var tb=t.closest('[data-tab]');if(tb){TAB=tb.getAttribute('data-tab');S.tab=TAB;save();render();window.scrollTo(0,0);return;}
  var wm=t.closest('[data-wm]');if(wm){WMODE=wm.getAttribute('data-wm');render();return;}
  var dk=t.closest('[data-deck]');if(dk){FS.deck=dk.getAttribute('data-deck');FS.idx=0;FS.flip=false;render();return;}
  var on=t.closest('[data-only]');if(on){FS.only=on.getAttribute('data-only')==='1';FS.idx=0;FS.flip=false;render();return;}
  var sy=t.closest('[data-story]');if(sy){SEL.story=parseInt(sy.getAttribute('data-story'),10);render();return;}
  var pc=t.closest('[data-pic]');if(pc){SEL.pic=parseInt(pc.getAttribute('data-pic'),10);render();return;}
  var dr=t.closest('[data-dr]');if(dr){var pr=dr.getAttribute('data-dr').split(':');DS[S.unit+':'+pr[0]]=parseInt(pr[1],10);render();return;}
  var ot=t.closest('[data-otok]');if(ot){
    var q=ot.getAttribute('data-otok').split(':'),i=parseInt(q[0],10),key=S.unit+':'+i;
    OS[key]=(OS[key]||[]).concat([parseInt(q[1],10)]);
    var row=document.querySelector('[data-orow="'+i+'"]');row.innerHTML=orderRow(i);row.classList.remove('ok','bad');return;
  }
  var os=t.closest('[data-osel]');if(os){
    var z=os.getAttribute('data-osel').split(':'),ii=parseInt(z[0],10),k2=S.unit+':'+ii,list=(OS[k2]||[]).slice();
    list.splice(parseInt(z[1],10),1);OS[k2]=list;
    var rw=document.querySelector('[data-orow="'+ii+'"]');rw.innerHTML=orderRow(ii);rw.classList.remove('ok','bad');return;
  }
  var mk=t.closest('[data-mark]');if(mk){
    var L=curList(),its=items();
    if(L.length){
      var idx=L[FS.idx%L.length],yes=mk.getAttribute('data-mark')==='1';
      if(yes){S.known[kOf(FS.deck,its[idx],idx)]=1;}else{delete S.known[kOf(FS.deck,its[idx],idx)];}
      save();
      if(!(FS.only&&yes)){FS.idx++;}
    }
    FS.flip=false;render();return;
  }
  var ac=t.closest('[data-act]');if(!ac){return;}
  var act=ac.getAttribute('data-act'),n=curList().length||1,ai=parseInt(ac.getAttribute('data-i'),10);
  if(act==='flip'){FS.flip=!FS.flip;render();}
  else if(act==='next'){FS.idx=(FS.idx+1)%n;FS.flip=false;render();}
  else if(act==='prev'){FS.idx=(FS.idx-1+n)%n;FS.flip=false;render();}
  else if(act==='shuffle'){shuffle();render();}
  else if(act==='resetk'){
    items().forEach(function(it,i){delete S.known[kOf(FS.deck,it,i)];});
    save();FS.only=false;FS.idx=0;FS.flip=false;render();
  }
  else if(act==='spcheck'){checkSpell(ai);}
  else if(act==='sphint'){setFb('sp'+ai,'Gợi ý: <b class="hintw">'+esc(hintOf(U().vocab[ai].w))+'</b>',null);}
  else if(act==='clcheck'){checkCloze(ai);}
  else if(act==='ocheck'){checkOrder(ai);}
  else if(act==='oclear'){OS[S.unit+':'+ai]=[];var r3=document.querySelector('[data-orow="'+ai+'"]');r3.innerHTML=orderRow(ai);r3.classList.remove('ok','bad');}
  else if(act==='cpcheck'){checkCopy(ai);}
  else if(act==='apcheck'){checkApply(ai);}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('data-act')==='flip'&&t.getAttribute('role')==='button'){e.preventDefault();FS.flip=true;render();}
  else if(e.key==='Enter'&&t&&t.getAttribute){
    var a=t.getAttribute('data-spin'),b=t.getAttribute('data-clin'),c=t.getAttribute('data-cpin');
    if(a!==null){checkSpell(parseInt(a,10));}else if(b!==null){checkCloze(parseInt(b,10));}else if(c!==null){checkCopy(parseInt(c,10));}
  }
});
window.addEventListener('hashchange',render);
if(!UNITS.some(function(u){return u.id===S.unit;})){S.unit='u1';}
render();
})();

</script>
