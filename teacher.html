<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng điều khiển giáo viên</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--muted:#5b6785;--line:#d9deea;--accent:#1f4fd8;--accent-ink:#fff;--accent-soft:#e8eeff;--good:#067647;--good-bg:#e7f6ee;--bad:#b42318;--bad-bg:#fdeceb;--warn:#b54708;--warn-bg:#fff4e5;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1524;--card:#18203a;--ink:#eef1fb;--muted:#a3aed0;--line:#2c3760;--accent:#7aa2ff;--accent-ink:#0b1430;--accent-soft:#22305e;--good:#52d296;--good-bg:#12332a;--bad:#ff8a80;--bad-bg:#3a1c1c;--warn:#ffb866;--warn-bg:#3a2a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:1.1rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tab .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid2>*,.stack>*,.card{min-width:0}
.grid2.sm{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:grid;gap:3px;font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:400;color:var(--ink)}
textarea{resize:vertical}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:700}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.note.ok{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);vertical-align:middle}
.dot.on{background:var(--good)}.dot.off{background:var(--warn)}
.login{max-width:420px;margin:12vh auto;padding:0 18px}
.login form{display:grid;gap:12px}
/* nội dung */
.cwrap{display:grid;gap:16px;grid-template-columns:270px 1fr;align-items:start}
@media (max-width:860px){.cwrap{grid-template-columns:1fr}}
.tree{display:grid;gap:4px;max-height:78vh;overflow:auto}
.tree h3{font-size:.85rem;color:var(--muted);margin:10px 0 2px}
.tnode{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.tnode:hover{background:var(--accent-soft)}.tnode[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
.bcard{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.bhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;cursor:pointer}
.bhead b{flex:1 1 180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbody{padding:4px 14px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.ir{display:grid;gap:6px;align-items:center}
.ir.v{grid-template-columns:52px 1fr 1fr 22px 32px}
.ir.g{grid-template-columns:1fr 1fr 1.4fr 32px}
.ir.s{grid-template-columns:70px 1fr 1fr 32px}
.ir.h{grid-template-columns:1fr 22px 32px}
.qbox{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.x{border:0;background:transparent;color:var(--bad);font-weight:700;cursor:pointer;font-size:1.1rem}
.preview{padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 -4px 14px rgba(20,33,61,.08)}
/* trực tiếp */
.big{font-size:2rem;font-weight:800;text-align:center;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.stud{display:flex;align-items:center;gap:8px;padding:4px 0}
.blist{display:grid;gap:6px}
.brow{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.brow span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:grid;gap:8px}
.subtxt{white-space:pre-wrap;background:var(--accent-soft);border-radius:10px;padding:10px;margin:0;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.88rem}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:640px;width:100%;max-height:84vh;overflow:auto}
.brow .n{min-width:0}.brow .btn{flex:none}.blist{min-width:0}
.filters{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{width:auto;min-width:140px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var API_URL='https://script.google.com/macros/s/AKfycbzIUFqCdDuiQ84D_pi4RO_HowyWcSWmdx_Yk95F0Jt6Bu_y6XYwDsJe75hxo5Wzfe95bA/exec';
var DEMO=/[?&]demo=1/.test(location.search);
var SEED={"weeks":[{"id":1,"title":"Tuần 1","topic":"Daily routines và thì hiện tại đơn","sub":"Nói và viết về một ngày của em: get up, have breakfast, always, usually, sometimes, never","goals":["Nói và viết về thói quen hằng ngày bằng thì hiện tại đơn","Thêm đúng -s, -es với he, she, it: gets up, watches, goes, has","Dùng always, usually, often, sometimes, never đúng vị trí","Đọc đúng âm cuối -s: /s/, /z/ và /ɪz/"],"plan":"2 buổi (25 phút) và 4 bài về nhà (15 đến 20 phút), tất cả làm trực tiếp trên trang","sections":[{"id":"b1","tab":"Buổi 1","title":"Từ vựng, Ngữ pháp và Nói","mins":25,"blocks":[{"t":"text","html":"<b>Hôm nay em học:<\/b><ul><li>12 cụm từ về thói quen hằng ngày.<\/li><li>Thì hiện tại đơn: <b>I get up<\/b> nhưng <b>she gets up<\/b>.<\/li><li>Các từ chỉ mức độ thường xuyên: <b>always, usually, often, sometimes, never<\/b>.<\/li><li>Nhìn tranh lớp học và nói các bạn đang làm gì.<\/li><\/ul>"},{"t":"vocab","title":"12 cụm từ về một ngày của em","instr":"Bấm vào thẻ để nghe cô đọc, rồi đọc theo to và rõ.","items":[{"w":"get up","icon":"⏰","vi":"thức dậy","au":{"segs":[{"v":"f","t":"get up"}],"s":0}},{"w":"have breakfast","icon":"🥣","vi":"ăn sáng","au":{"segs":[{"v":"f","t":"have breakfast"}],"s":0}},{"w":"brush my teeth","icon":"🪥","vi":"đánh răng","au":{"segs":[{"v":"f","t":"brush my teeth"}],"s":0}},{"w":"go to school","icon":"🏫","vi":"đi học","au":{"segs":[{"v":"f","t":"go to school"}],"s":0}},{"w":"have lunch","icon":"🍱","vi":"ăn trưa","au":{"segs":[{"v":"f","t":"have lunch"}],"s":0}},{"w":"do my homework","icon":"✏️","vi":"làm bài tập về nhà","au":{"segs":[{"v":"f","t":"do my homework"}],"s":0}},{"w":"play badminton","icon":"🏸","vi":"chơi cầu lông","au":{"segs":[{"v":"f","t":"play badminton"}],"s":0}},{"w":"tidy my room","icon":"🧹","vi":"dọn phòng","au":{"segs":[{"v":"f","t":"tidy my room"}],"s":0}},{"w":"watch TV","icon":"📺","vi":"xem ti vi","au":{"segs":[{"v":"f","t":"watch TV"}],"s":0}},{"w":"have a shower","icon":"🚿","vi":"tắm vòi sen","au":{"segs":[{"v":"f","t":"have a shower"}],"s":0}},{"w":"read a comic","icon":"📖","vi":"đọc truyện tranh","au":{"segs":[{"v":"f","t":"read a comic"}],"s":0}},{"w":"go to bed","icon":"🛏️","vi":"đi ngủ","au":{"segs":[{"v":"f","t":"go to bed"}],"s":0}}]},{"t":"rule","title":"Thì hiện tại đơn: thêm -s với he, she, it","pics":[{"icon":"⏰","cap":"I get up at six.","au":{"segs":[{"v":"f","t":"I get up at six."}],"s":0}},{"icon":"🥣","cap":"She has breakfast.","au":{"segs":[{"v":"f","t":"She has breakfast."}],"s":0}},{"icon":"📺","cap":"He watches TV.","au":{"segs":[{"v":"f","t":"He watches TV."}],"s":0}},{"icon":"🏫","cap":"They go to school.","au":{"segs":[{"v":"f","t":"They go to school."}],"s":0}}],"head":["Chủ ngữ","Động từ","Ví dụ"],"rows":[["I / You / We / They","get up","We get up at six thirty.",{"segs":[{"v":"f","t":"We get up at six thirty."}],"s":0}],["He / She / It","gets up","She gets up at seven.",{"segs":[{"v":"f","t":"She gets up at seven."}],"s":0}],["He / She / It","plays","He plays badminton after school.",{"segs":[{"v":"f","t":"He plays badminton after school."}],"s":0}],["He / She / It","watches","My brother watches TV in the evening.",{"segs":[{"v":"f","t":"My brother watches TV in the evening."}],"s":0}],["He / She / It","goes","My dad goes to work by bus.",{"segs":[{"v":"f","t":"My dad goes to work by bus."}],"s":0}],["He / She / It","has","Linh has lunch at school.",{"segs":[{"v":"f","t":"Linh has lunch at school."}],"s":0}]],"note":"<b>Quy tắc:<\/b> thêm <b>-s<\/b> (gets, plays). Động từ tận cùng <b>-ch, -sh, -ss, -x, -o<\/b> thì thêm <b>-es<\/b> (watch → watches, brush → brushes, go → goes). Riêng <b>have → has<\/b>.<br><b>Câu hỏi và câu phủ định:<\/b> dùng do hoặc does, động từ trở về nguyên mẫu: <b>Does she get up early?<\/b> · <b>She doesn't get up early.<\/b> (không nói <i>She doesn't gets up<\/i>)."},{"t":"rule","title":"Từ chỉ mức độ thường xuyên","head":["Từ","Nghĩa","Ví dụ"],"rows":[["always","luôn luôn (100%)","I always brush my teeth before bed.",{"segs":[{"v":"f","t":"I always brush my teeth before bed."}],"s":0}],["usually","thường thường","She usually has noodles for breakfast.",{"segs":[{"v":"f","t":"She usually has noodles for breakfast."}],"s":0}],["often","hay, thường","We often play badminton at the weekend.",{"segs":[{"v":"f","t":"We often play badminton at the weekend."}],"s":0}],["sometimes","thỉnh thoảng","He sometimes reads a comic after dinner.",{"segs":[{"v":"f","t":"He sometimes reads a comic after dinner."}],"s":0}],["never","không bao giờ (0%)","I never watch TV before my homework.",{"segs":[{"v":"f","t":"I never watch TV before my homework."}],"s":0}]],"note":"<b>Vị trí:<\/b> đứng <b>trước động từ thường<\/b> (I <b>always<\/b> get up early) nhưng <b>sau am, is, are<\/b> (She is <b>never<\/b> late)."},{"t":"gap","title":"Điền dạng đúng của động từ","instr":"Gõ động từ trong ngoặc ở dạng đúng (nhớ -s hoặc -es với he, she, it), rồi bấm Kiểm tra.","qs":[{"pre":"She ","ans":["gets up"],"post":" at seven o'clock. (get up)"},{"pre":"I ","ans":["brush"],"post":" my teeth every morning. (brush)"},{"pre":"My brother ","ans":["watches"],"post":" TV in the evening. (watch)"},{"pre":"Linh ","ans":["has"],"post":" lunch at school. (have)"},{"pre":"We ","ans":["go"],"post":" to school by bike. (go)"},{"pre":"He ","ans":["does"],"post":" his homework after dinner. (do)"},{"pre":"My mum ","ans":["goes"],"post":" to work by bus. (go)"},{"pre":"They ","ans":["play"],"post":" badminton on Sundays. (play)"}]},{"t":"mcq","title":"Chọn câu đúng","instr":"Chọn một đáp án cho mỗi câu.","qs":[{"q":"Which sentence is correct?","opts":["He get up at six.","He gets up at six.","He getting up at six."],"ans":1,"why":"He là một người nên động từ thêm -s."},{"q":"Which sentence is correct?","opts":["I always am late.","I am always late.","I am late always."],"ans":1,"why":"Always đứng sau am, is, are."},{"q":"My sister ___ her teeth twice a day.","opts":["brush","brushes","brushing"],"ans":1,"why":"Brush tận cùng -sh nên thêm -es."},{"q":"Which sentence is correct?","opts":["She doesn't likes fish.","She doesn't like fish.","She don't like fish."],"ans":1,"why":"Sau doesn't, động từ trở về nguyên mẫu."},{"q":"___ your brother play football at the weekend?","opts":["Do","Does","Is"],"ans":1,"why":"Your brother là he nên dùng Does."},{"q":"I ___ watch TV before I do my homework. (0%)","opts":["always","sometimes","never"],"ans":2,"why":"Never nghĩa là không bao giờ."}]},{"t":"speak","title":"Nhìn tranh và nói","scene":"classroom","prompt":"Look at the picture. What are the children doing?","frames":["This is a ___. There are ___ children.","The girl with pigtails is ___ing a ___.","He / She is wearing ___.","The ___ is on / under / next to the ___."],"modelTitle":"Bài nói mẫu của cô","model":{"segs":[{"v":"f","t":"This is a classroom. There are five children. The girl with pigtails is reading a book. The boy next to her is writing. Jack is drawing and he is wearing glasses. Lucy is standing in front of the board. The clock is on the wall and the red bag is under the table."}],"s":0},"check":["Nói ít nhất 4 câu","Có There are và đếm đúng số bạn","Dùng đúng is/are + động từ-ing","Có từ chỉ vị trí (on, under, next to, in front of)"],"kw":[{"l":"There are / There is","re":"there (is|are)"},{"l":"Động từ -ing","re":"\\w+ing\\b"},{"l":"Vị trí (on, under, next to...)","re":"\\b(on|under|next to|in front of|behind)\\b"},{"l":"Màu sắc","re":"\\b(red|blue|green|brown|yellow|black|pink)\\b"}],"minWords":25},{"t":"teacher","html":"<b>Phân bổ 25 phút:<\/b> 0–3 chào hỏi, hỏi miệng \"What time do you get up?\" · 3–9 từ mới (đọc, đóng kịch động tác) · 9–15 thêm -s/-es, bảng tần suất · 15–20 điền động từ, chọn câu đúng · 20–25 nhìn tranh và nói (học sinh ghi âm và nộp ngay trên trang).<br><b>Lỗi hay gặp của học sinh lớp 4:<\/b> quên -s với he/she/it, thêm -s sau does/doesn't, đặt always sau động từ thường, nuốt âm cuối.<br><b>Cách sửa:<\/b> không ngắt lời. Nhắc lại câu đúng chậm rồi cho bé nói lạ       var p=$('.cwrap');if(p){render()}}
    else{btn.disabled=false;msg.textContent=j.error||'Chưa lưu được'}
  }).catch(function(){btn.disabled=false;msg.textContent='Chưa kết nối được Apps Script.'});
}
function showHistory(cur,D,draw){
  var key='sec:w'+cur.w+'.'+cur.sid;
  var list=el('div',{class:'stack'},[el('p',{class:'muted',text:'Đang tải...'})]);
  var m=el('div',{class:'modal',onclick:function(e){if(e.target===m){m.remove()}}},[el('div',{class:'card stack',role:'dialog','aria-label':'Lịch sử bản lưu'},[el('div',{class:'row'},[el('h2',{text:'Lịch sử bản lưu'}),el('button',{class:'btn ghost sm',style:'margin-left:auto',onclick:function(){m.remove()},text:'Đóng'})]),list])]);
  document.body.appendChild(m);
  api({action:'lr_history',key:key}).then(function(j){
    list.innerHTML='';
    if(!j.ok||!j.items.length){list.appendChild(el('p',{class:'muted',text:j.ok?'Chưa có bản lưu nào cho ngày học này.':(j.error||'Không tải được lịch sử.')}));return}
    j.items.forEach(function(it){
      var o;try{o=JSON.parse(it.json)}catch(e){return}
      list.appendChild(el('div',{class:'brow'},[el('span',{class:'n',text:it.at+' · '+it.by+' · '+((o.blocks||[]).length)+' khối'}),
        el('button',{class:'btn ghost sm',onclick:function(){
          cur.draft={title:o.title||D.title,mins:o.mins||D.mins,tab:o.tab||D.tab,blocks:o.blocks||[]};cur.open={};dirty();m.remove();render();toast('Đã nạp bản này. Bấm Lưu để đăng lại.');
        },text:'Nạp bản này'})]));
    });
  }).catch(function(){list.innerHTML='';list.appendChild(el('p',{class:'muted',text:'Chưa kết nối được.'}))});
}

var sess=null;try{sess=JSON.parse(sessionStorage.getItem('dd-sess'))}catch(e){}
if(sess&&sess.name){S.user=sess;render();boot()}else{render()}
})();
